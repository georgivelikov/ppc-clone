server:
  port: 8081

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: identity
  datasource:
    url: jdbc:postgresql://localhost:5432/identity
    username: cutpay
    password: cutpay
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    property-naming-strategy: SNAKE_CASE
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

cutpay:
  kyc:
    # The pretend identity-verification provider and company registry.
    url: http://localhost:8093
    poll-interval: PT3S
  auth:
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    # Set to true behind HTTPS. Plain-http localhost needs false or the browser drops the cookie.
    secure-cookies: false
