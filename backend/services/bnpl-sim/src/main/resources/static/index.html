<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BNPL simulator</title>
  <style>
    :root { --bg: #fafaf9; --card: #fff; --text: #1c1917; --muted: #78716c; --line: #e7e5e4; --accent: #0f766e; --bad: #b91c1c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1917; --card: #292524; --text: #fafaf9; --muted: #a8a29e; --line: #44403c; --accent: #2dd4bf; --bad: #f87171; }
    }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
    main { max-width: 56rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
    p.lead { color: var(--muted); margin: 0 0 1.5rem; }
    .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: .75rem; padding: 1rem; }
    .card h2 { font-size: 1.05rem; margin: 0 0 .15rem; }
    .card .about { color: var(--muted); font-size: .85rem; margin: 0 0 .75rem; }
    label { display: block; font-size: .85rem; color: var(--muted); margin-top: .6rem; }
    input[type=number] { width: 100%; box-sizing: border-box; padding: .4rem .5rem; border: 1px solid var(--line); border-radius: .4rem;
      background: transparent; color: inherit; font: inherit; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
    button { padding: .45rem .8rem; border-radius: .4rem; border: 1px solid var(--accent); background: var(--accent); color: #fff;
      font: inherit; cursor: pointer; }
    button.secondary { background: transparent; color: var(--accent); }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .down { color: var(--bad); font-weight: 600; }
    footer { display: flex; gap: .75rem; align-items: center; margin-top: 1.5rem; }
    #status { color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
<main>
  <h1>BNPL simulator</h1>
  <p class="lead">Four pretend buy-now-pay-later providers. Switch one off, slow it down or make it hang to see how the aggregator copes.
    Changes apply at once and are forgotten when the simulator restarts.</p>
  <section class="grid" id="providers" aria-live="polite"></section>
  <footer>
    <button class="secondary" id="reset">Forget everything and start over</button>
    <span id="status" role="status"></span>
  </footer>
</main>
<script>
  const ABOUT = {
    splitnow: "Pay in 3 or 4, EUR 50 to 1,500. Answers at once.",
    lendo: "Loans of 6 to 24 months, EUR 100 to 10,000. Decides later and calls back.",
    kreditko: "Loans of 3 to 36 months, EUR 200 to 15,000. Polled; big ones go to review.",
    paylatereu: "Pay in 30 days, EUR 20 to 800. Flaky: some calls hang."
  };
  const status = document.getElementById("status");
  const container = document.getElementById("providers");

  function say(text) { status.textContent = text; }

  async function load() {
    const response = await fetch("/admin/providers");
    const providers = await response.json();
    container.replaceChildren(...Object.entries(providers).map(([code, s]) => card(code, s)));
  }

  function card(code, s) {
    const el = document.createElement("article");
    el.className = "card";
    el.innerHTML = `
      <div class="row"><h2>${code}</h2><span class="down" ${s.outage ? "" : "hidden"}>down</span></div>
      <p class="about">${ABOUT[code] || ""}</p>
      <label class="row"><span>Outage (answers 503)</span><input type="checkbox" data-field="outage" ${s.outage ? "checked" : ""}></label>
      <label>Extra latency (ms)<input type="number" min="0" step="100" data-field="latency_ms" value="${s.latency_ms}"></label>
      <label>Share of calls that hang, then time out (0 to 1)<input type="number" min="0" max="1" step="0.05" data-field="timeout_rate" value="${s.timeout_rate}"></label>
      <label>Time to decide (ms), for those that decide later<input type="number" min="0" step="500" data-field="decision_delay_ms" value="${s.decision_delay_ms}"></label>
      <p><button type="button">Apply to ${code}</button></p>`;
    el.querySelector("button").addEventListener("click", () => save(code, el));
    return el;
  }

  async function save(code, el) {
    const body = {};
    el.querySelectorAll("[data-field]").forEach((input) => {
      body[input.dataset.field] = input.type === "checkbox" ? input.checked : Number(input.value);
    });
    const response = await fetch("/admin/providers/" + code, { method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body) });
    say(response.ok ? code + " updated" : "Could not update " + code);
    await load();
  }

  document.getElementById("reset").addEventListener("click", async () => {
    const response = await fetch("/admin/reset", { method: "POST" });
    say(response.ok ? "Everything forgotten" : "Could not reset");
    await load();
  });

  load().catch(() => say("Could not load the providers"));
</script>
</body>
</html>
