server:
  port: 8080

spring:
  application:
    name: gateway
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keys are fetched lazily, so the gateway can start before identity does.
          jwk-set-uri: ${cutpay.upstreams.identity}/.well-known/jwks.json
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-auth
              uri: ${cutpay.upstreams.identity}
              predicates:
                - Path=/auth/**
              filters:
                # Brute-force protection: 5 requests/second per client IP, bursts of 10.
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
            - id: identity-api
              uri: ${cutpay.upstreams.identity}
              predicates:
                - Path=/me,/v1/merchant,/.well-known/**
            - id: payments-api
              uri: ${cutpay.upstreams.payments}
              predicates:
                - Path=/v1/payment_intents/**,/v1/payment_intents,/v1/refunds/**,/v1/refunds,/v1/checkout_sessions,/v1/payment_stats
            - id: ledger-api
              uri: ${cutpay.upstreams.ledger}
              predicates:
                - Path=/v1/balance,/v1/balance_transactions,/v1/balance_transactions/**,/v1/balance_summary
            - id: payouts-api
              uri: ${cutpay.upstreams.payouts}
              predicates:
                - Path=/v1/payouts,/v1/payouts/**,/v1/payout_schedule,/v1/bank_accounts,/v1/bank_accounts/**
            - id: checkout-public
              uri: ${cutpay.upstreams.payments}
              predicates:
                - Path=/checkout/**
              filters:
                # Anyone can reach these, so limit them per client address.
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
            # Only the card vault and the fake bank's 3DS page are public. Everything else on the
            # acquirer (/authorize, /refund, /admin/**) is deliberately not routed.
            - id: acquirer-public
              uri: ${cutpay.upstreams.acquirer}
              predicates:
                - Path=/vault/tokenize,/vault/3ds/challenge/*/complete
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

cutpay:
  upstreams:
    identity: http://localhost:8081
    payments: http://localhost:8082
    acquirer: http://localhost:8083
    ledger: http://localhost:8084
    payouts: http://localhost:8085
