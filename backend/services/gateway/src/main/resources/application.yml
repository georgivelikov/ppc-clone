server:
  port: 8080

spring:
  application:
    name: gateway
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keys are fetched lazily, so the gateway can start before identity does.
          jwk-set-uri: ${cutpay.upstreams.identity}/.well-known/jwks.json
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # The request log must never slow the API down: give up quickly when Kafka is unreachable.
      acks: 1
      properties:
        max.block.ms: 1000
        delivery.timeout.ms: 5000
        request.timeout.ms: 2000
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-auth
              uri: ${cutpay.upstreams.identity}
              predicates:
                - Path=/auth/**
              filters:
                # Brute-force protection: 5 requests/second per client IP, bursts of 10.
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
            - id: identity-api
              uri: ${cutpay.upstreams.identity}
              predicates:
                - Path=/me,/v1/merchant,/v1/api_keys,/v1/api_keys/**,/v1/connected_accounts,/v1/connected_accounts/**,/.well-known/**
            - id: payments-api
              uri: ${cutpay.upstreams.payments}
              predicates:
                - Path=/v1/payment_intents/**,/v1/payment_intents,/v1/refunds/**,/v1/refunds,/v1/checkout_sessions,/v1/payment_stats,/v1/terminal/**,/v1/customers,/v1/customers/**,/v1/setup_intents,/v1/setup_intents/**
            - id: links-api
              uri: ${cutpay.upstreams.links}
              predicates:
                - Path=/v1/payment_links,/v1/payment_links/**,/v1/qr
            - id: billing-api
              uri: ${cutpay.upstreams.billing}
              predicates:
                - Path=/v1/products,/v1/products/**,/v1/prices,/v1/prices/**,/v1/subscriptions,/v1/subscriptions/**,/v1/subscription_stats,/v1/invoices,/v1/invoices/**,/v1/credit_balances,/v1/billing_settings,/v1/billing_notifications
            - id: invoices-public
              uri: ${cutpay.upstreams.billing}
              predicates:
                - Path=/invoices/**
              filters:
                # Public and unauthenticated, so limit it per client address like the checkout.
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
            - id: ledger-api
              uri: ${cutpay.upstreams.ledger}
              predicates:
                - Path=/v1/balance,/v1/balance_transactions,/v1/balance_transactions/**,/v1/balance_summary
            - id: payouts-api
              uri: ${cutpay.upstreams.payouts}
              predicates:
                - Path=/v1/payouts,/v1/payouts/**,/v1/payout_schedule,/v1/bank_accounts,/v1/bank_accounts/**
            - id: webhooks-api
              uri: ${cutpay.upstreams.webhooks}
              predicates:
                - Path=/v1/webhook_endpoints,/v1/webhook_endpoints/**,/v1/webhook_deliveries,/v1/webhook_deliveries/**,/v1/events,/v1/events/**,/v1/logs,/v1/logs/**
            - id: links-public
              uri: ${cutpay.upstreams.links}
              predicates:
                - Path=/links/**
              filters:
                # Public and unauthenticated, so limit it per client address like the checkout.
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
            - id: bnpl-api
              uri: ${cutpay.upstreams.bnpl}
              predicates:
                - Path=/v1/bnpl/**
            - id: bnpl-callback
              uri: ${cutpay.upstreams.bnpl}
              predicates:
                - Path=/bnpl/callback/**
            # Must come before checkout-public, which would otherwise take every /checkout path to payments.
            - id: bnpl-public
              uri: ${cutpay.upstreams.bnpl}
              predicates:
                - Path=/checkout/*/bnpl/**
              filters:
                # Every request fans out to the providers, so keep it tighter than the rest of the checkout.
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
            - id: checkout-public
              uri: ${cutpay.upstreams.payments}
              predicates:
                - Path=/checkout/**
              filters:
                # Anyone can reach these, so limit them per client address.
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
            # Only the card vault and the fake bank's 3DS page are public. Everything else on the
            # acquirer (/authorize, /refund, /admin/**) is deliberately not routed.
            - id: acquirer-public
              uri: ${cutpay.upstreams.acquirer}
              predicates:
                - Path=/vault/tokenize,/vault/3ds/challenge/*/complete
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

cutpay:
  request-log:
    # Publishes one event per authenticated API request to the api.requests topic (never bodies).
    enabled: true
  upstreams:
    identity: http://localhost:8081
    payments: http://localhost:8082
    acquirer: http://localhost:8083
    ledger: http://localhost:8084
    payouts: http://localhost:8085
    webhooks: http://localhost:8086
    links: http://localhost:8087
    billing: http://localhost:8088
    bnpl: http://localhost:8090
