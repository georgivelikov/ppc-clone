<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pretend bank app</title>
  <style>
    :root { --bg: #f4f4f5; --card: #fff; --text: #18181b; --muted: #71717a; --line: #e4e4e7; --accent: #1d4ed8; --bad: #b91c1c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #18181b; --card: #27272a; --text: #fafafa; --muted: #a1a1aa; --line: #3f3f46; --accent: #60a5fa; --bad: #f87171; }
    }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 24rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
    p.lead { color: var(--muted); margin: 0 0 1.25rem; font-size: .9rem; }
    .request { background: var(--card); border: 1px solid var(--line); border-radius: .75rem; padding: 1rem; margin-bottom: .75rem; }
    .amount { font-size: 1.5rem; font-weight: 600; }
    .ref { color: var(--muted); font-size: .8rem; word-break: break-all; }
    .actions { display: flex; gap: .5rem; margin-top: .75rem; }
    button { flex: 1; padding: .6rem; border-radius: .5rem; border: 1px solid var(--accent); background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
    button.reject { background: transparent; color: var(--bad); border-color: var(--bad); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #empty { color: var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>Pretend bank app</h1>
  <p class="lead">A BLIK payment waits here for your confirmation. If you do nothing it is approved by itself after a few seconds.</p>
  <section id="requests" aria-live="polite"></section>
  <p id="empty">No payments are waiting for you.</p>
</main>
<script>
  const list = document.getElementById("requests");
  const empty = document.getElementById("empty");
  const money = (minor, currency) => (minor / 100).toLocaleString("pl-PL", { style: "currency", currency });

  async function answer(id, verb) {
    await fetch("../blik/requests/" + encodeURIComponent(id) + "/" + verb, { method: "POST" });
    await refresh();
  }

  function card(request) {
    const el = document.createElement("div");
    el.className = "request";
    el.dataset.testid = "blik-request";
    el.innerHTML = '<div class="amount"></div><div class="ref"></div><div class="actions"></div>';
    el.querySelector(".amount").textContent = money(request.amount, request.currency);
    el.querySelector(".ref").textContent = request.reference || request.id;
    const actions = el.querySelector(".actions");
    for (const [verb, label, cls] of [["approve", "Approve", ""], ["reject", "Reject", "reject"]]) {
      const button = document.createElement("button");
      button.textContent = label;
      button.className = cls;
      button.addEventListener("click", () => answer(request.id, verb));
      actions.appendChild(button);
    }
    return el;
  }

  async function refresh() {
    const response = await fetch("../blik/requests");
    const requests = response.ok ? await response.json() : [];
    list.replaceChildren(...requests.map(card));
    empty.hidden = requests.length > 0;
  }

  refresh();
  setInterval(refresh, 1000);
</script>
</body>
</html>
