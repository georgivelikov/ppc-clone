footer=You get this email because of your Cutpay account or a payment you made. Cutpay is a study project; no real money moves.

team_invite.subject={{inviter}} invited you to {{merchant_name}} on Cutpay
team_invite.body={{inviter}} invited you to join {{merchant_name}} as {{role}}.\n\n[Accept the invitation]({{invite_url}})\n\nThe link works once and expires in 7 days.

password_reset.subject=Reset your Cutpay password
password_reset.body=Someone asked to reset the password of your Cutpay account. If it was you, choose a new one here:\n\n[Choose a new password]({{reset_url}})\n\nThe link works once and expires in one hour. If it was not you, ignore this email: your password has not changed.

email_verification.subject=Confirm your email address
email_verification.body=Confirm that this is your email address so we can reach you about your account.\n\n[Confirm my email]({{verify_url}})

kyc_approved.subject={{merchant_name}} is approved
kyc_approved.body=Good news: we checked {{merchant_name}} and it is approved. You can now switch to live mode.\n\n[Open the dashboard]({{dashboard_url}})

kyc_rejected.subject=We could not approve {{merchant_name}}
kyc_rejected.body=We checked the details of {{merchant_name}} and could not approve it.\n\nReason: {{reason}}\n\nIf you think this is a mistake, reply to this email.

kyc_needs_info.subject=We need a little more from you
kyc_needs_info.body=To finish checking {{merchant_name}} we need more information.\n\nWhat is missing: {{reason}}\n\n[Continue the application]({{resume_url}})

dispute_opened.subject=A customer disputed a payment of {{amount}} {{currency}}
dispute_opened.body=A customer disputed payment {{payment_id}} ({{amount}} {{currency}}). The money has been set aside while it is decided.\n\nSend your evidence by {{due_by}}, or the dispute is lost.\n\n[Open the dispute]({{dispute_url}})

dispute_closed.subject=Dispute on {{amount}} {{currency}}: you {{outcome}}
dispute_closed.body=The dispute on payment {{payment_id}} was decided: you {{outcome}}.\n\n[See the details]({{dispute_url}})

payout_paid.subject=Payout of {{amount}} {{currency}} is on its way
payout_paid.body=A payout of {{amount}} {{currency}} was sent to your bank account and arrives on {{arrival}}.\n\n[See the payout]({{payout_url}})

payment_receipt.subject=Receipt from {{merchant_name}} for {{amount}} {{currency}}
payment_receipt.body=Thank you. {{merchant_name}} received your payment of {{amount}} {{currency}}.\n\nPayment reference: {{payment_id}}

payment_new.subject=New payment of {{amount}} {{currency}}
payment_new.body=A customer paid {{amount}} {{currency}} ({{payment_id}}).\n\n[Open the payment]({{payment_url}})

report_ready.subject=Your {{report_type}} report is ready
report_ready.body=The report you asked for is ready.\n\n[Download it]({{download_url}})\n\nThe link works for 15 minutes.
