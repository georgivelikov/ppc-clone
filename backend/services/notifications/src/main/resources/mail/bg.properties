footer=Получавате този имейл заради профила ви в Cutpay или плащане, което сте направили. Cutpay е учебен проект; не се движат реални пари.

team_invite.subject={{inviter}} ви покани в {{merchant_name}} в Cutpay
team_invite.body={{inviter}} ви покани да се присъедините към {{merchant_name}} с роля {{role}}.\n\n[Приемане на поканата]({{invite_url}})\n\nВръзката работи веднъж и важи 7 дни.

password_reset.subject=Нова парола за Cutpay
password_reset.body=Някой поиска нова парола за профила ви в Cutpay. Ако сте вие, изберете я тук:\n\n[Избор на нова парола]({{reset_url}})\n\nВръзката работи веднъж и важи един час. Ако не сте вие, пренебрегнете имейла: паролата ви не е променена.

email_verification.subject=Потвърдете имейл адреса си
email_verification.body=Потвърдете, че това е вашият имейл адрес, за да можем да се свързваме с вас за профила ви.\n\n[Потвърждавам имейла си]({{verify_url}})

kyc_approved.subject={{merchant_name}} е одобрена
kyc_approved.body=Добра новина: проверихме {{merchant_name}} и фирмата е одобрена. Вече можете да преминете към реален режим.\n\n[Към таблото]({{dashboard_url}})

kyc_rejected.subject=Не можахме да одобрим {{merchant_name}}
kyc_rejected.body=Проверихме данните на {{merchant_name}} и не можахме да я одобрим.\n\nПричина: {{reason}}\n\nАко смятате, че е грешка, отговорете на този имейл.

kyc_needs_info.subject=Трябва ни още малко информация
kyc_needs_info.body=За да довършим проверката на {{merchant_name}}, трябва ни още информация.\n\nКакво липсва: {{reason}}\n\n[Продължаване на заявлението]({{resume_url}})

dispute_opened.subject=Клиент оспори плащане от {{amount}} {{currency}}
dispute_opened.body=Клиент оспори плащане {{payment_id}} ({{amount}} {{currency}}). Парите са задържани, докато се реши спорът.\n\nИзпратете доказателства до {{due_by}}, иначе спорът е загубен.\n\n[Към спора]({{dispute_url}})

dispute_closed.subject=Спор за {{amount}} {{currency}}: {{outcome}}
dispute_closed.body=Спорът за плащане {{payment_id}} е решен: {{outcome}}.\n\n[Подробности]({{dispute_url}})

payout_paid.subject=Изплащане от {{amount}} {{currency}} е на път
payout_paid.body=Изплащане от {{amount}} {{currency}} е изпратено към банковата ви сметка и пристига на {{arrival}}.\n\n[Към изплащането]({{payout_url}})

payment_receipt.subject=Разписка от {{merchant_name}} за {{amount}} {{currency}}
payment_receipt.body=Благодарим ви. {{merchant_name}} получи плащането ви от {{amount}} {{currency}}.\n\nНомер на плащането: {{payment_id}}

payment_new.subject=Ново плащане от {{amount}} {{currency}}
payment_new.body=Клиент плати {{amount}} {{currency}} ({{payment_id}}).\n\n[Към плащането]({{payment_url}})

report_ready.subject=Вашият отчет „{{report_type}}“ е готов
report_ready.body=Отчетът, който поискахте, е готов.\n\n[Изтегляне]({{download_url}})\n\nВръзката работи 15 минути.
