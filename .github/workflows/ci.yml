name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # Integration tests start Postgres, Kafka and Redis with Testcontainers (Docker is preinstalled).
      - run: ./gradlew build --console=plain

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: docker compose -f infra/docker-compose.yml up -d --wait
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results

  woocommerce-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP lint and tests
        run: |
          docker run --rm -v "$PWD/plugins/woocommerce/cutpay-for-woocommerce:/p" php:8.3-cli sh -c \
            'for f in $(find /p -name "*.php"); do php -l "$f" | grep -v "^No syntax" || true; done; php /p/tests/run.php'

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chart lints and renders
        run: |
          docker run --rm -v "$PWD/deploy/helm:/c" alpine/helm:3.18.4 lint /c/cutpay
          mkdir -p .render
          docker run --rm -v "$PWD/deploy/helm:/c" alpine/helm:3.18.4 template cutpay /c/cutpay --set keda.enabled=true --set rollout.enabled=true > .render/all.yaml
      - name: Manifests are valid, operator resources included
        run: |
          docker run --rm -v "$PWD/.render:/m" ghcr.io/yannh/kubeconform:latest -summary -strict \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' /m/all.yaml
      - name: The images build
        run: |
          docker build -q -f backend/Dockerfile --build-arg SERVICE=kyc-sim -t cutpay/kyc-sim:ci backend
          docker build -q -f frontend/Dockerfile --build-arg APP=checkout -t cutpay/checkout:ci .
