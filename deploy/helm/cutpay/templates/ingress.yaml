{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cutpay
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range $name, $host := .Values.ingress.hosts }}
    - host: {{ $host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ if eq $name "api" }}gateway{{ else }}{{ $name }}{{ end }}
                port:
                  number: {{ if eq $name "api" }}8080{{ else }}80{{ end }}
    {{- end }}
{{- end }}
