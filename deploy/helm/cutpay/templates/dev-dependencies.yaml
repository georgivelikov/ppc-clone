{{- if .Values.devDependencies.enabled }}
# Small stand-ins for what a real environment gets from managed services. Not for anything that matters:
# Vault here is dev mode (in memory, a fixed root token), Redis has no persistence, Mailpit catches every email.
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: redis}}
  template:
    metadata: {labels: {app.kubernetes.io/name: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{name: redis, containerPort: 6379}]
          resources: {requests: {cpu: 20m, memory: 32Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
  selector: {app.kubernetes.io/name: redis}
  ports: [{port: 6379, targetPort: redis}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mailpit}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: mailpit}}
  template:
    metadata: {labels: {app.kubernetes.io/name: mailpit}}
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.27
          ports: [{name: smtp, containerPort: 1025}, {name: ui, containerPort: 8025}]
          resources: {requests: {cpu: 20m, memory: 32Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: mailpit}
spec:
  selector: {app.kubernetes.io/name: mailpit}
  ports: [{name: smtp, port: 1025, targetPort: smtp}, {name: ui, port: 8025, targetPort: ui}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: vault}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: vault}}
  template:
    metadata: {labels: {app.kubernetes.io/name: vault}}
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.20
          env:
            - {name: VAULT_DEV_ROOT_TOKEN_ID, value: cutpay-dev-root}
            - {name: VAULT_DEV_LISTEN_ADDRESS, value: "0.0.0.0:8200"}
          ports: [{name: http, containerPort: 8200}]
          readinessProbe:
            httpGet: {path: /v1/sys/health, port: http}
          resources: {requests: {cpu: 20m, memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: vault}
spec:
  selector: {app.kubernetes.io/name: vault}
  ports: [{port: 8200, targetPort: http}]
{{- end }}
