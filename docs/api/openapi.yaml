        name:
          type: string
          maxLength: 160
        email:
          type: string
          format: email
        iban:
          type: string
          description: Where the account is paid out. Spaces are ignored; the checksum is verified.
    UpdateConnectedAccount:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        iban:
          type: string
    ConnectedAccount:
      type: object
      required: [id, object, name, status, currency]
      properties:
        id:
          type: string
        object:
          type: string
