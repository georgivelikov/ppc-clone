          items:
            type: object
            required: [description, unit_amount, quantity]
            properties:
              description:
                type: string
              unit_amount:
                type: integer
                format: int64
                description: A negative amount is a discount.
              quantity:
                type: integer
                minimum: 1
        collection_method:
          type: string
          enum: [charge_automatically, send_invoice]
          default: send_invoice
        days_until_due:
          type: integer
          minimum: 0
          default: 14
        tax_rate_percent:
          type: number
        description:
          type: string
        merchant_name:
          type: string
    Invoice:
      type: object
      required: [id, object, status, customer, currency, total]
      properties:
        id:
          type: string
        object:
          type: string
          const: invoice
        livemode:
          type: boolean
        number:
          type: [string, "null"]
          description: Set when the invoice is finalized, for example INV-0001.
        status:
          $ref: "#/components/schemas/InvoiceStatus"
        subscription:
          type: [string, "null"]
        customer:
          type: string
        customer_email:
          type: [string, "null"]
        customer_name:
          type: [string, "null"]
        billing_reason:
          type: string
          enum: [manual, subscription_create, subscription_cycle, subscription_update]
        collection_method:
          type: string
        currency:
          type: string
        subtotal:
          type: integer
          format: int64
        tax:
          type: integer
          format: int64
        credit_applied:
          type: integer
          format: int64
          description: Paid from the customer's credit. `total` is what is left to pay after it.
        total:
          type: integer
          format: int64
        amount_paid:
          type: integer
          format: int64
        amount_due:
          type: integer
          format: int64
        description:
          type: [string, "null"]
        due_date:
          type: [string, "null"]
          format: date-time
        period_start:
          type: [string, "null"]
          format: date-time
        period_end:
          type: [string, "null"]
          format: date-time
        payment_intent:
          type: [string, "null"]
        failure_code:
          type: [string, "null"]
        attempt_count:
          type: integer
        next_payment_attempt:
          type: [string, "null"]
          format: date-time
        hosted_invoice_url:
          type: [string, "null"]
          description: The page where the customer can see and pay the invoice.
        invoice_pdf:
          type: [string, "null"]
        lines:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceLine"
        attempts:
          type:
            - array
            - "null"
          description: The scheduled and finished payment attempts. Only on a single invoice.
          items:
            type: object
            properties:
              attempt_no:
                type: integer
              scheduled_at:
                type: string
                format: date-time
              executed_at:
                type: [string, "null"]
                format: date-time
              result:
                type: [string, "null"]
        created_at:
          type: string
          format: date-time
        finalized_at:
          type: [string, "null"]
          format: date-time
        paid_at:
          type: [string, "null"]
          format: date-time
