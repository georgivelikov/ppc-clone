        amount:
          type: [integer, "null"]
          format: int64
        currency:
          type: string
        min_amount:
          type: [integer, "null"]
          format: int64
        max_amount:
          type: [integer, "null"]
          format: int64
        title:
          type: string
        description:
          type: [string, "null"]
        image_url:
          type: [string, "null"]
        collect:
          type: array
          items:
            type: string
            enum: [email, phone, name, address]
        quantity_adjustable:
          type: boolean
        max_uses:
          type: [integer, "null"]
        uses_count:
