        ranked:
          type: array
          description: Every provider that could finance the payment, best first.
          items:
            type: object
            properties:
              provider:
                type: string
              name:
                type: string
              rank:
                type: integer
              score:
                type: number
              best:
                type: object
                description: The offer that costs you least.
                properties:
                  plan:
                    type: string
                  merchant_fee:
                    type: integer
                    format: int64
                  total_payable:
                    type: integer
                    format: int64
              stats:
                type: object
                properties:
                  approval_rate:
                    type: number
                  p50_decision_ms:
                    type: integer
        excluded:
          type: array
          description: The providers left out and why.
          items:
            type: object
            properties:
              provider:
                type: string
              code:
                type: string
                examples: [below_minimum]
              message:
                type: string
        created_at:
          type: string
          format: date-time
    BnplAnalytics:
      type: object
      properties:
        object:
          type: string
          const: bnpl_analytics
        days:
          type: integer
        providers:
          type: array
          items:
            type: object
            properties:
              provider:
                type: string
              name:
                type: string
              applications:
                type: integer
              approved:
                type: integer
              declined:
                type: integer
              failed:
                type: integer
              pending:
                type: integer
              abandoned:
                type: integer
              approval_rate:
                type: [number, "null"]
                description: Of the applications that were decided; null while there are none.
              avg_decision_ms:
                type: integer
              p50_decision_ms:
                type: integer
              volume:
                type: integer
                format: int64
              fees:
                type: integer
                format: int64
              circuit:
                type: string
                enum: [closed, open, half_open]
        applications:
          type: integer
        approved:
          type: integer
        volume:
          type: integer
          format: int64
        fees:
          type: integer
          format: int64
    PaymentIntent:
      type: object
      required: [id, object, livemode, amount, currency, status, created_at]
      properties:
        id:
          type: string
        object:
          type: string
          const: payment_intent
        livemode:
          type: boolean
        amount:
          type: integer
          format: int64
        currency:
          type: string
        status:
          $ref: "#/components/schemas/PaymentStatus"
        capture_method:
          type: string
        channel:
          type: string
          enum: [online, moto]
          description: |
            `online` for checkout and the API. `moto` (mail or telephone order) for payments keyed in by the
            merchant at the dashboard's virtual terminal; the card network does not ask for 3-D Secure for those.
        description:
          type: [string, "null"]
        customer_email:
          type: [string, "null"]
        metadata:
          $ref: "#/components/schemas/Metadata"
        client_secret:
          type: string
          description: Hand this to the checkout SDK. Treat it like a password for this one payment.
        return_url:
          type: [string, "null"]
        amount_refunded:
          type: integer
          format: int64
        customer:
          type: [string, "null"]
          description: The customer the payment belongs to.
        payment_method:
          type: [string, "null"]
          description: The saved card the payment was charged to.
        off_session:
          type: boolean
          description: Charged to a saved card without the customer present.
        payment_method_type:
          type: string
          enum: [card, bnpl]
          description: How the payment was settled; `bnpl` when a provider financed it in instalments.
        bnpl:
          type: [object, "null"]
          description: Who financed a payment settled in instalments, and what they kept.
          properties:
            provider:
              type: string
            application:
              type: string
            fee:
              type: integer
              format: int64
        application_fee_amount:
          type: [integer, "null"]
          format: int64
        transfer_data:
          type:
            - array
            - "null"
          description: How the payment is shared with connected accounts. Only on a single payment.
          items:
            type: object
            properties:
              destination:
                type: string
              amount:
                type: integer
                format: int64
        amount_authorized:
          type: [integer, "null"]
          format: int64
          description: What was held on the card for a `manual` capture payment. `amount` is what was taken once captured.
        capture_before:
          type: [string, "null"]
          format: date-time
          description: While `requires_capture`, the moment after which the hold is released automatically.
        failure_code:
          type: [string, "null"]
        failure_message:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/PaymentAttempt"
        refunds:
          type: array
          items:
            $ref: "#/components/schemas/Refund"
        latest_attempt:
          description: The newest attempt's id, or the attempt itself with `expand[]=latest_attempt`.
          oneOf:
            - type: string
            - $ref: "#/components/schemas/PaymentAttempt"
            - type: "null"
    PaymentIntentList:
      type: object
      required: [object, data, has_more]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/PaymentIntent"
        has_more:
          type: boolean
    CheckoutSession:
      type: object
      required: [payment_id, client_secret, url]
      properties:
        payment_id:
          type: string
        client_secret:
          type: string
        url:
          type: string
          format: uri
          description: Send the customer here.
    LinkLineItem:
      type: object
      required: [product_name, unit_amount, quantity]
      properties:
        product_name:
          type: string
          maxLength: 120
        unit_amount:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 99
    QrStyle:
      type: object
      description: Colours of the printed code. Keep strong contrast or phones may not scan it.
      properties:
        fg:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        bg:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
    PaymentLinkStatus:
      type: string
      enum: [active, inactive, expired, sold_out]
    CreatePaymentLink:
      type: object
      required: [type, currency, title]
      properties:
        type:
          type: string
          enum: [fixed, customer_chooses, products]
        currency:
          type: string
        title:
          type: string
          maxLength: 120
        amount:
          type: integer
          format: int64
          description: Required for `fixed` links.
        min_amount:
          type: integer
          format: int64
          description: For `customer_chooses` links. Defaults to 100.
        max_amount:
          type: integer
          format: int64
          description: For `customer_chooses` links. Defaults to the largest payment.
        line_items:
          type: array
          maxItems: 20
          description: Required for `products` links.
          items:
            $ref: "#/components/schemas/LinkLineItem"
        description:
          type: string
          maxLength: 1000
        image_url:
          type: string
          format: uri
        collect:
          type: array
          description: What to ask the customer for before they pay.
          items:
            type: string
            enum: [email, phone, name, address]
        quantity_adjustable:
          type: boolean
          description: Lets the customer change the quantity (not for `customer_chooses` links).
        max_uses:
          type: integer
          minimum: 1
          description: The link closes after this many successful payments, however many customers open it at once.
        expires_at:
          type: string
          format: date-time
        after_completion:
          type: string
          enum: [message, redirect]
          default: message
        redirect_url:
          type: string
          format: uri
          description: Required when `after_completion` is `redirect`.
        success_message:
          type: string
          maxLength: 500
        metadata:
          $ref: "#/components/schemas/Metadata"
        qr_style:
          $ref: "#/components/schemas/QrStyle"
    UpdatePaymentLink:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        image_url:
          type: string
          format: uri
        collect:
          type: array
          items:
            type: string
            enum: [email, phone, name, address]
        max_uses:
          type: integer
          minimum: 1
        expires_at:
          type: string
          format: date-time
        active:
          type: boolean
        after_completion:
          type: string
          enum: [message, redirect]
        redirect_url:
          type: string
          format: uri
        success_message:
          type: string
        metadata:
          $ref: "#/components/schemas/Metadata"
        qr_style:
          $ref: "#/components/schemas/QrStyle"
    PaymentLink:
      type: object
      required: [id, object, livemode, url, slug, status, type, currency, title, active, created_at]
      properties:
        id:
          type: string
        object:
          type: string
          const: payment_link
        livemode:
          type: boolean
        url:
          type: string
          format: uri
          description: Share this address.
        slug:
          type: string
        status:
