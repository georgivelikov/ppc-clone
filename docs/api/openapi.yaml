        lines:
          type: array
          items:
            type: object
            properties:
              description:
                type: string
              unit_amount:
                type: integer
                format: int64
              quantity:
                type: integer
              amount:
                type: integer
                format: int64
    UpcomingInvoice:
      type: object
      properties:
        object:
          type: string
          const: upcoming_invoice
        currency:
          type: string
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceLine"
        subtotal:
          type: integer
          format: int64
        tax:
          type: integer
          format: int64
        credit_applied:
          type: integer
          format: int64
          description: What the customer's credit would cover. `total` is what is left to charge.
        total:
          type: integer
          format: int64
    SubscriptionStats:
      type: object
      properties:
        object:
          type: string
