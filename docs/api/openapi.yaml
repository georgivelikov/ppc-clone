        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/BalanceTransaction"
        has_more:
          type: boolean
    PayoutStatus:
      type: string
      enum: [pending, in_transit, paid, failed]
    Payout:
      type: object
      required: [id, object, amount, fee, currency, status, kind]
      properties:
        id:
