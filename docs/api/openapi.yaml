          description: Bills every this many intervals, for example every 3 months.
        trial_days:
          type: integer
          minimum: 0
          maximum: 730
          description: Days of free trial when a subscription starts on this price.
        nickname:
          type: string
    Price:
      type: object
      required: [id, object, product, unit_amount, currency, type, active]
      properties:
        id:
          type: string
        object:
          type: string
          const: price
        livemode:
          type: boolean
        product:
          type: string
        unit_amount:
          type: integer
          format: int64
        currency:
          type: string
        type:
          type: string
          enum: [one_time, recurring]
        interval:
          type: [string, "null"]
          enum: [day, week, month, year, null]
        interval_count:
          type: integer
        trial_days:
          type: integer
        nickname:
          type: [string, "null"]
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
    PriceList:
      type: object
      required: [object, data, has_more]
      properties:
        object:
          type: string
