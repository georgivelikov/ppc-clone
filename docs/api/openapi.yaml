webhooks:
  event:
    post:
      tags: [Webhooks]
      operationId: receiveEvent
      summary: An event, sent to your endpoint
      description: |
        Cutpay sends a `POST` with the event as JSON. Answer with any `2xx` status within 10 seconds to
        acknowledge it; anything else, or no answer, makes Cutpay retry after 1 minute, 5 minutes, 30 minutes,
        2 hours, 5 hours and then every 10 hours, for up to 3 days.

        Requests carry `Cutpay-Signature: t=<unix seconds>,v1=<hex>`, where `v1` is the HMAC-SHA256 of
        `<t>.<raw body>` using your endpoint's signing secret. Check it on the **raw** body and reject requests
        whose timestamp is more than 5 minutes old. The same event can arrive more than once (use the event
        `id` to deduplicate), and events can arrive out of order.
      security: []
      parameters:
        - name: Cutpay-Signature
          in: header
          required: true
          schema:
            type: string
            examples:
              - t=1760000000,v1=53dc054739ad94d3532227ba8d397f66ed2166a6b66940c2006692fa6db6829f
        - name: Cutpay-Event-Id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Event"
      responses:
        "200":
          description: Acknowledged. Any 2xx status works.
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: "sk_test_... / sk_live_... / rk_..."
      description: A secret or restricted API key. Publishable keys cannot call this API.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Makes the request safe to retry. Up to 255 characters; kept for 24 hours.
      schema:
        type: string
        maxLength: 255
    ApiVersion:
      name: Cutpay-Version
      in: header
      required: false
      description: The API version to use. Defaults to the latest.
      schema:
        type: string
        enum: ["2026-10-01"]
    Limit:
      name: limit
      in: query
      description: How many objects to return (1 to 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    StartingAfter:
      name: starting_after
      in: query
      description: The `id` of the last object of the previous page.
      schema:
        type: string
    ExpandPayment:
      name: expand[]
      in: query
      description: Fields to replace with the full object.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum: [latest_attempt]
    PaymentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [pay_01J9ZK3Q8V2M6X4N7B5C1D0E9F]
    CustomerId:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [cus_01J9ZK3Q8V2M6X4N7B5C1D0E9F]
    SetupIntentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [seti_01J9ZK3Q8V2M6X4N7B5C1D0E9F]
    ConnectedAccountId:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [acct_01J9ZK3Q8V2M6X4N7B5C1D0E9F]
    ConnectedAccountQuery:
      name: connected_account
      in: query
      required: false
      description: Read the balance of one of your connected accounts instead of your own.
      schema:
        type: string
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [prod_01J9ZK3Q8V2M6X4N7B5C1D0E9F]
    PriceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [price_01J9ZK3Q8V2M6X4N7B5C1D0E9F]
    SubscriptionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [sub_01J9ZK3Q8V2M6X4N7B5C1D0E9F]
    InvoiceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [in_01J9ZK3Q8V2M6X4N7B5C1D0E9F]
    LinkId:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [plink_01J9ZK3Q8V2M6X4N7B5C1D0E9F]
    EndpointId:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [we_01J9ZK3Q8V2M6X4N7B5C1D0E9F]
    DeliveryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [whd_01J9ZK3Q8V2M6X4N7B5C1D0E9F]
  responses:
    InvalidRequest:
      description: The request was not valid. `error.param` names the offending field when there is one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The API key is missing, wrong, revoked or expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The key is valid but may not do this, for example a restricted key without the scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such object in this mode.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The object is in a state that does not allow this, or the idempotency key was misused.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message]
          properties:
            type:
              type: string
              examples: [invalid_request_error]
            code:
              type: string
              description: A stable machine-readable code.
              examples: [payment_not_found]
            message:
              type: string
            param:
              type: string
            request_id:
              type: string
    Deleted:
      type: object
      required: [id, object, deleted]
      properties:
        id:
          type: string
        object:
          type: string
        deleted:
          type: boolean
    Metadata:
      type: object
      description: Your own key-value data, kept on the object and returned as you sent it.
      additionalProperties:
        type: string
    PaymentStatus:
      type: string
      enum:
        - requires_payment_method
        - processing
        - requires_action
        - requires_capture
        - succeeded
        - failed
        - canceled
        - partially_refunded
        - refunded
    CreatePaymentIntent:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 99999999
          description: In the smallest currency unit.
        currency:
          type: string
          description: Three-letter ISO code.
          examples: [EUR]
        description:
          type: string
          maxLength: 500
        customer_email:
          type: string
          format: email
        metadata:
          $ref: "#/components/schemas/Metadata"
        return_url:
          type: string
          format: uri
          description: Where the customer returns after paying on the hosted page.
        merchant_name:
          type: string
          maxLength: 160
          description: Shown to the customer on the checkout.
        capture_method:
          type: string
          enum: [automatic, manual]
          default: automatic
          description: |
            `manual` only holds the amount on the card (status `requires_capture`). Take it with
            `POST /v1/payment_intents/{id}/capture`, or release it by cancelling. A hold that is not captured within
            seven days is released automatically.
        customer:
          type: string
          description: A customer id. Needed for `payment_method`, `off_session` and `setup_future_usage`.
        payment_method:
          type: string
          description: A saved card of the customer. With `off_session` and none given, the default card is used.
        off_session:
          type: boolean
          description: |
            Charge the saved card right away without the customer being present (subscriptions, repeat orders). The
            bank cannot ask for 3-D Secure then: a card that needs it fails with `authentication_required` and the
            customer has to pay on a hosted page.
        setup_future_usage:
          type: string
          enum: [off_session]
          description: Save the card the customer pays with to the customer, for future off-session payments.
        transfer_data:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/TransferData"
          description: |
            Share the payment with connected accounts once it succeeds. Give each destination an amount and the platform
            keeps the rest, or name one destination without an amount and set `application_fee_amount`. The processing
            fee is paid by the platform from its own part. A payment captured later cannot be split.
        application_fee_amount:
          type: integer
          format: int64
          minimum: 0
          description: What the platform keeps of the payment. The single destination receives everything else.
    Address:
      type: object
      properties:
        line1:
          type: [string, "null"]
        line2:
          type: [string, "null"]
        city:
          type: [string, "null"]
        postal_code:
          type: [string, "null"]
        country:
          type: [string, "null"]
    CreateCustomer:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        phone:
          type: string
        description:
          type: string
        address:
          $ref: "#/components/schemas/Address"
        metadata:
          $ref: "#/components/schemas/Metadata"
    UpdateCustomer:
      allOf:
        - $ref: "#/components/schemas/CreateCustomer"
