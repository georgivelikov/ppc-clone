          type: array
          description: >-
            The last six calendar months (UTC), oldest first. Of the subscriptions that existed when the month
            began, `ended` is how many ended during it.
          items:
            type: object
            properties:
              month:
                type: string
                examples: ["2026-10"]
              at_start:
                type: integer
              ended:
                type: integer
    CreditBalance:
      type: object
      properties:
