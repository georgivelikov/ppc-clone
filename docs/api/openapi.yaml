openapi: 3.1.0
info:
  title: Cutpay API
  version: "2026-10-01"
  summary: Accept card payments, see your balance and get paid out.
  description: |
    The Cutpay API is organised around REST. It has predictable resource URLs, accepts and returns JSON,
    and uses standard HTTP status codes and verbs.

    ## Authentication
    Authenticate with an API key in the `Authorization` header: `Authorization: Bearer sk_test_...`.
    Keys come in three kinds:

    - **Secret keys** (`sk_test_...`, `sk_live_...`) have full access. Keep them on your server.
    - **Restricted keys** (`rk_test_...`, `rk_live_...`) are limited to the resources you choose, for example
      `payments:read`. A scope ending in `:write` also allows reading.
    - **Publishable keys** (`pk_test_...`, `pk_live_...`) are safe to put in web pages. They can only be used
      with the checkout SDK and cannot call this API.

    A key works in one mode. **Test mode** and **live mode** data are completely separate: a test key never sees
    live objects and the other way round.

    ## Idempotency
    Send an `Idempotency-Key` header on `POST` requests. Repeating a request with the same key and body replays
    the first response (marked `Idempotent-Replayed: true`) instead of creating a second object. Using the same
    key with a different body returns `409 idempotency_key_reuse`. Keys expire after 24 hours.

    ## Versioning
    Pin the behaviour you integrated against with `Cutpay-Version: 2026-10-01`. Without it you get the latest
    version. Every response repeats the version used in the `Cutpay-Version` header.

    ## Money
    Amounts are integers in the smallest currency unit, so `2500` with `EUR` is €25.00.

    ## Lists
    List endpoints return `{ "object": "list", "data": [...], "has_more": true }` and page with `limit` and
    `starting_after` (the `id` of the last object you received).

    ## Expanding
    Some fields hold an id by default and can be replaced by the full object with `expand[]`, for example
    `GET /v1/payment_intents/{id}?expand[]=latest_attempt`.

    ## Webhooks
    Cutpay sends events to your endpoints as signed HTTP requests; see the webhook endpoint operations and the
    webhooks guide. Verify the `Cutpay-Signature` header before trusting a request.
  license:
    name: Educational project
    identifier: MIT
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - apiKey: []
tags:
  - name: Payments
    description: Create and track card payments.
  - name: Customers
    description: People and companies you sell to, and the cards they saved for later.
  - name: Payment links
    description: Get paid without a website, with a shareable link or a QR code.
  - name: Refunds
    description: Return money to a customer.
  - name: Balance
    description: Pending, available and reserved funds, and every movement behind them.
  - name: Payouts
    description: Money sent to your bank account.
  - name: Webhooks
    description: Endpoints that receive events, and the log of what was sent.
  - name: Events
    description: Everything that happened in your account.
paths:
  /v1/payment_intents:
    post:
      tags: [Payments]
      operationId: createPaymentIntent
      summary: Create a payment
      description: |
        Creates a payment waiting for a card. Give the returned `client_secret` to the checkout SDK, or use
        `/v1/checkout_sessions` for the hosted page.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentIntent"
      responses:
        "201":
          description: The payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Payments]
      operationId: listPaymentIntents
      summary: List payments
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PaymentStatus"
        - name: q
          in: query
          description: Matches the payment id or the customer email.
          schema:
            type: string
        - name: from
          in: query
          description: Only payments created at or after this time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Only payments created before this time.
          schema:
            type: string
            format: date-time
        - name: min_amount
          in: query
          schema:
            type: integer
            format: int64
        - name: max_amount
          in: query
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/ExpandPayment"
      responses:
        "200":
          description: A page of payments, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/payment_intents/{id}:
    get:
      tags: [Payments]
      operationId: getPaymentIntent
      summary: Retrieve a payment
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/ExpandPayment"
      responses:
        "200":
          description: The payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/payment_intents/{id}/capture:
    post:
      tags: [Payments]
      operationId: capturePaymentIntent
      summary: Capture an authorised payment
      description: |
        Takes money from a payment created with `capture_method: manual` once it is `requires_capture`. A smaller
        `amount_to_capture` takes only that part and releases the rest; the payment is then for the captured amount.
        A capture can be made once.
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureRequest"
      responses:
        "200":
          description: The captured payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/payment_intents/{id}/cancel:
    post:
      tags: [Payments]
      operationId: cancelPaymentIntent
      summary: Cancel a payment
      description: Cancels a payment that has not been paid yet, or releases the hold of an authorised one (`requires_capture`).
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The canceled payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/customers:
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create a customer
      description: A customer groups the saved cards, payments, subscriptions and invoices of one person or company.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomer"
      responses:
        "201":
          description: The customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: List customers
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - name: q
          in: query
          description: Matches part of the name, email or id.
          schema:
            type: string
      responses:
        "200":
          description: Customers, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/customers/{id}:
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Retrieve a customer
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: The customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Customers]
      operationId: updateCustomer
      summary: Update a customer
      description: Fields you leave out stay as they are. `default_payment_method` picks the saved card used when none is named.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomer"
      responses:
        "200":
          description: The updated customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Customers]
      operationId: deleteCustomer
      summary: Delete a customer
      description: Hides the customer and removes their saved cards. Their payments and invoices stay on record.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/customers/{id}/payment_methods:
    get:
      tags: [Customers]
      operationId: listCustomerPaymentMethods
      summary: List the saved cards of a customer
      description: Only brand, last four digits and expiry are returned. The card number is never stored here.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: Saved cards, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethodList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/customers/{id}/payment_methods/{payment_method_id}:
    delete:
      tags: [Customers]
      operationId: detachPaymentMethod
      summary: Remove a saved card
      description: If it was the default, another saved card takes over. Subscriptions are not changed, so one that used only this card fails its next payment.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
        - name: payment_method_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/setup_intents:
    post:
      tags: [Customers]
      operationId: createSetupIntent
      summary: Save a card without charging it
      description: |
        Creates a setup intent and the address of a hosted page where the customer enters their card. The bank may
        ask them to authenticate once (3-D Secure); after that the card can be charged without them, for example
        by a subscription. The result arrives as `setup_intent.succeeded` or `setup_intent.setup_failed`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSetupIntent"
      responses:
        "201":
          description: The setup intent. Send the customer to `url`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupIntent"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/setup_intents/{id}:
    get:
      tags: [Customers]
      operationId: getSetupIntent
      summary: Retrieve a setup intent
      parameters:
        - $ref: "#/components/parameters/SetupIntentId"
      responses:
        "200":
          description: The setup intent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupIntent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/setup_intents/{id}/cancel:
    post:
      tags: [Customers]
      operationId: cancelSetupIntent
      summary: Cancel a setup intent
      description: The hosted page stops accepting a card.
      parameters:
        - $ref: "#/components/parameters/SetupIntentId"
      responses:
        "200":
          description: The canceled setup intent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupIntent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/checkout_sessions:
    post:
      tags: [Payments]
      operationId: createCheckoutSession
      summary: Create a hosted checkout
      description: Creates a payment and returns the address of the page where the customer pays.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentIntent"
      responses:
        "201":
          description: The payment and where to send the customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/payment_intents/{id}/stream:
    get:
      tags: [Payments]
      operationId: streamPaymentIntent
      summary: Follow a payment live
      description: |
        A Server-Sent Events stream (`Accept: text/event-stream`). It starts with the payment's current status and
        then sends one `status` event for every change, closing after the payment reaches an end state
        (`succeeded`, `failed`, `canceled`, `refunded`). Use it to flip a screen the moment a customer has paid,
        for example next to a printed QR code. For back-end processing use webhooks instead.
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: "The event stream. Each event has the name `status` and JSON data such as `{\"status\":\"succeeded\"}`."
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/payment_links:
    post:
      tags: [Payment links]
      operationId: createPaymentLink
      summary: Create a payment link
      description: |
        A link opens a Cutpay page where the customer pays. A **fixed** link has one price, a
        **customer_chooses** link lets the customer type the amount (within `min_amount` and `max_amount`), and a
        **products** link sums its line items. Price, currency and type cannot be changed afterwards: create a
        new link instead.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentLink"
      responses:
        "201":
          description: The link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLink"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [Payment links]
      operationId: listPaymentLinks
      summary: List payment links
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
      responses:
        "200":
          description: A page of links, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLinkList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/payment_links/{id}:
    get:
      tags: [Payment links]
      operationId: getPaymentLink
      summary: Retrieve a payment link
      parameters:
        - $ref: "#/components/parameters/LinkId"
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Payment links]
      operationId: updatePaymentLink
      summary: Update a payment link
      description: |
        Set `active` to `false` to stop taking payments. A link also closes by itself when it reaches `max_uses`
        or its `expires_at`. Fields you leave out stay as they are.
      parameters:
        - $ref: "#/components/parameters/LinkId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePaymentLink"
      responses:
        "200":
          description: The updated link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLink"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/payment_links/{id}/payments:
    get:
      tags: [Payment links]
      operationId: listPaymentLinkPayments
      summary: List the payments made with a link
      parameters:
        - $ref: "#/components/parameters/LinkId"
      responses:
        "200":
          description: Paid uses of the link, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLinkPayments"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/payment_links/{id}/qr:
    get:
      tags: [Payment links]
      operationId: getPaymentLinkQr
      summary: Download the QR code of a link
      description: Returns the code as an image. Colours default to the ones saved on the link.
      parameters:
        - $ref: "#/components/parameters/LinkId"
        - name: format
          in: query
          schema:
            type: string
            enum: [svg, png]
            default: svg
        - name: size
          in: query
          description: Target width in pixels for PNG (128 to 2048).
          schema:
            type: integer
            minimum: 128
            maximum: 2048
            default: 512
        - name: fg
          in: query
          description: Code colour as `#rrggbb`.
          schema:
            type: string
            pattern: "^#[0-9a-fA-F]{6}$"
        - name: bg
          in: query
          description: Background colour as `#rrggbb`.
          schema:
            type: string
            pattern: "^#[0-9a-fA-F]{6}$"
      responses:
        "200":
          description: The image.
          content:
            image/svg+xml:
              schema:
                type: string
            image/png:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/payment_links/{id}/card.pdf:
    get:
      tags: [Payment links]
      operationId: getPaymentLinkCard
      summary: Download a print-ready table card
      description: An A6 PDF with the link's name, its QR code and the address in words.
      parameters:
        - $ref: "#/components/parameters/LinkId"
      responses:
        "200":
          description: The PDF.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/refunds:
    post:
      tags: [Refunds]
      operationId: createRefund
      summary: Refund a payment
      description: |
        Refunds all or part of a succeeded payment. The processing fee is not returned. A payment can be refunded
        several times until its whole amount has been returned.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_intent]
              properties:
                payment_intent:
                  type: string
                  description: The payment to refund.
                amount:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Defaults to everything still refundable.
                reason:
                  type: string
                  maxLength: 200
      responses:
        "201":
          description: The refund.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [Refunds]
      operationId: listRefunds
      summary: List refunds
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - name: payment_intent
          in: query
          description: Only refunds of this payment.
          schema:
            type: string
      responses:
        "200":
          description: A page of refunds, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/balance:
    get:
      tags: [Balance]
      operationId: getBalance
      summary: Retrieve your balance
      description: |
        `pending` funds are not yet available, `available` funds can be paid out. A negative amount means you
        owe money, for example after a refund that followed a payout.
      responses:
        "200":
          description: Your balance, per currency.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/balance_transactions:
    get:
      tags: [Balance]
      operationId: listBalanceTransactions
      summary: List balance transactions
      description: Every payment, refund and payout that moved your balance, with fees and net amounts.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - name: type
          in: query
          schema:
            type: string
            enum: [payment, refund, payout]
        - name: source
          in: query
          description: A payment id (also matches its refunds), refund id or payout id.
          schema:
            type: string
      responses:
        "200":
          description: A page of balance transactions, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceTransactionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/payouts:
    get:
      tags: [Payouts]
      operationId: listPayouts
      summary: List payouts
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PayoutStatus"
      responses:
        "200":
          description: A page of payouts, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Payouts]
      operationId: createPayout
      summary: Pay out now
      description: |
        Pays out everything that is available straight away. Instant payouts cost 1% on top; waiting for the next
        scheduled payout is free. Use `GET /v1/payouts/preview` to see the cost first.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                currency:
                  type: string
                  default: EUR
      responses:
