        current_period_end:
          type: string
          format: date-time
        trial_end:
          type: [string, "null"]
          format: date-time
        cancel_at_period_end:
          type: boolean
        collection_paused:
          type: boolean
        canceled_at:
          type: [string, "null"]
          format: date-time
        ended_at:
          type: [string, "null"]
          format: date-time
        tax_rate_percent:
          type: number
        latest_invoice:
          type: [string, "null"]
        metadata:
          $ref: "#/components/schemas/Metadata"
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              price:
                type: string
              product:
                type: string
              product_name:
                type: string
              nickname:
                type: [string, "null"]
              unit_amount:
                type: integer
                format: int64
              quantity:
                type: integer
              amount:
                type: integer
                format: int64
        created_at:
          type: string
          format: date-time
    SubscriptionList:
