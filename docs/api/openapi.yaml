openapi: 3.1.0
info:
  title: Cutpay API
  version: "2026-10-01"
  summary: Accept card payments, see your balance and get paid out.
  description: |
    The Cutpay API is organised around REST. It has predictable resource URLs, accepts and returns JSON,
    and uses standard HTTP status codes and verbs.

    ## Authentication
    Authenticate with an API key in the `Authorization` header: `Authorization: Bearer sk_test_...`.
    Keys come in three kinds:

    - **Secret keys** (`sk_test_...`, `sk_live_...`) have full access. Keep them on your server.
    - **Restricted keys** (`rk_test_...`, `rk_live_...`) are limited to the resources you choose, for example
      `payments:read`. A scope ending in `:write` also allows reading.
    - **Publishable keys** (`pk_test_...`, `pk_live_...`) are safe to put in web pages. They can only be used
      with the checkout SDK and cannot call this API.

    A key works in one mode. **Test mode** and **live mode** data are completely separate: a test key never sees
    live objects and the other way round.

    ## Idempotency
    Send an `Idempotency-Key` header on `POST` requests. Repeating a request with the same key and body replays
    the first response (marked `Idempotent-Replayed: true`) instead of creating a second object. Using the same
    key with a different body returns `409 idempotency_key_reuse`. Keys expire after 24 hours.

    ## Versioning
    Pin the behaviour you integrated against with `Cutpay-Version: 2026-10-01`. Without it you get the latest
    version. Every response repeats the version used in the `Cutpay-Version` header.

    ## Money
    Amounts are integers in the smallest currency unit, so `2500` with `EUR` is €25.00.

    ## Lists
    List endpoints return `{ "object": "list", "data": [...], "has_more": true }` and page with `limit` and
    `starting_after` (the `id` of the last object you received).

    ## Expanding
    Some fields hold an id by default and can be replaced by the full object with `expand[]`, for example
    `GET /v1/payment_intents/{id}?expand[]=latest_attempt`.

    ## Webhooks
    Cutpay sends events to your endpoints as signed HTTP requests; see the webhook endpoint operations and the
    webhooks guide. Verify the `Cutpay-Signature` header before trusting a request.
  license:
    name: Educational project
    identifier: MIT
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - apiKey: []
tags:
  - name: Payments
    description: Create and track card payments.
  - name: Customers
    description: People and companies you sell to, and the cards they saved for later.
  - name: Connected accounts
    description: Sub-merchants of a platform, who receive part of its payments.
  - name: Billing
    description: Products and prices, subscriptions and invoices.
  - name: Instalments
    description: Customers pay in parts with buy-now-pay-later providers; you are paid up front.
  - name: Payment links
    description: Get paid without a website, with a shareable link or a QR code.
  - name: Refunds
    description: Return money to a customer.
  - name: Balance
    description: Pending, available and reserved funds, and every movement behind them.
  - name: Payouts
    description: Money sent to your bank account.
  - name: Webhooks
    description: Endpoints that receive events, and the log of what was sent.
  - name: Events
    description: Everything that happened in your account.
paths:
  /v1/payment_intents:
    post:
      tags: [Payments]
      operationId: createPaymentIntent
      summary: Create a payment
      description: |
        Creates a payment waiting for a card. Give the returned `client_secret` to the checkout SDK, or use
        `/v1/checkout_sessions` for the hosted page.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentIntent"
      responses:
        "201":
          description: The payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Payments]
      operationId: listPaymentIntents
      summary: List payments
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PaymentStatus"
        - name: q
          in: query
          description: Matches the payment id or the customer email.
          schema:
            type: string
        - name: from
          in: query
          description: Only payments created at or after this time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Only payments created before this time.
          schema:
            type: string
            format: date-time
        - name: min_amount
          in: query
          schema:
            type: integer
            format: int64
        - name: max_amount
          in: query
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/ExpandPayment"
      responses:
        "200":
          description: A page of payments, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/payment_intents/{id}:
    get:
      tags: [Payments]
      operationId: getPaymentIntent
      summary: Retrieve a payment
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/ExpandPayment"
      responses:
        "200":
          description: The payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/payment_intents/{id}/capture:
    post:
      tags: [Payments]
      operationId: capturePaymentIntent
      summary: Capture an authorised payment
      description: |
        Takes money from a payment created with `capture_method: manual` once it is `requires_capture`. A smaller
        `amount_to_capture` takes only that part and releases the rest; the payment is then for the captured amount.
        A capture can be made once.
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureRequest"
      responses:
        "200":
          description: The captured payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/payment_intents/{id}/cancel:
    post:
      tags: [Payments]
      operationId: cancelPaymentIntent
      summary: Cancel a payment
      description: Cancels a payment that has not been paid yet, or releases the hold of an authorised one (`requires_capture`).
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The canceled payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/customers:
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create a customer
      description: A customer groups the saved cards, payments, subscriptions and invoices of one person or company.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomer"
      responses:
        "201":
          description: The customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: List customers
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - name: q
          in: query
          description: Matches part of the name, email or id.
          schema:
            type: string
      responses:
        "200":
          description: Customers, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/customers/{id}:
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Retrieve a customer
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: The customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Customers]
      operationId: updateCustomer
      summary: Update a customer
      description: Fields you leave out stay as they are. `default_payment_method` picks the saved card used when none is named.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomer"
      responses:
        "200":
          description: The updated customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Customers]
      operationId: deleteCustomer
      summary: Delete a customer
      description: Hides the customer and removes their saved cards. Their payments and invoices stay on record.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/customers/{id}/payment_methods:
    get:
      tags: [Customers]
      operationId: listCustomerPaymentMethods
      summary: List the saved cards of a customer
      description: Only brand, last four digits and expiry are returned. The card number is never stored here.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: Saved cards, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethodList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/customers/{id}/payment_methods/{payment_method_id}:
    delete:
      tags: [Customers]
      operationId: detachPaymentMethod
      summary: Remove a saved card
      description: If it was the default, another saved card takes over. Subscriptions are not changed, so one that used only this card fails its next payment.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
        - name: payment_method_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/setup_intents:
    post:
      tags: [Customers]
      operationId: createSetupIntent
      summary: Save a card without charging it
      description: |
        Creates a setup intent and the address of a hosted page where the customer enters their card. The bank may
        ask them to authenticate once (3-D Secure); after that the card can be charged without them, for example
        by a subscription. The result arrives as `setup_intent.succeeded` or `setup_intent.setup_failed`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSetupIntent"
      responses:
        "201":
          description: The setup intent. Send the customer to `url`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupIntent"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/setup_intents/{id}:
    get:
      tags: [Customers]
      operationId: getSetupIntent
      summary: Retrieve a setup intent
      parameters:
        - $ref: "#/components/parameters/SetupIntentId"
      responses:
        "200":
          description: The setup intent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupIntent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/setup_intents/{id}/cancel:
    post:
      tags: [Customers]
      operationId: cancelSetupIntent
      summary: Cancel a setup intent
      description: The hosted page stops accepting a card.
      parameters:
        - $ref: "#/components/parameters/SetupIntentId"
      responses:
        "200":
          description: The canceled setup intent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupIntent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/connected_accounts:
    post:
      tags: [Connected accounts]
      operationId: createConnectedAccount
      summary: Create a connected account
      description: |
        A sub-merchant of your platform, for example a restaurant on a delivery app. Send it part of a payment with
        `transfer_data`; what it earns is paid out to its IBAN on its own schedule.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectedAccount"
      responses:
        "201":
          description: The account. Only the last four digits of the IBAN are returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedAccount"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [Connected accounts]
      operationId: listConnectedAccounts
      summary: List connected accounts
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
      responses:
        "200":
          description: Accounts, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedAccountList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/connected_accounts/{id}:
    get:
      tags: [Connected accounts]
      operationId: getConnectedAccount
      summary: Retrieve a connected account
      description: Its balance is `GET /v1/balance?connected_account={id}`.
      parameters:
        - $ref: "#/components/parameters/ConnectedAccountId"
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Connected accounts]
      operationId: updateConnectedAccount
      summary: Update a connected account
      description: Changing the IBAN moves future payouts to it. It has to stay in the same country.
      parameters:
        - $ref: "#/components/parameters/ConnectedAccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConnectedAccount"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedAccount"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/connected_accounts/{id}/disable:
    post:
      tags: [Connected accounts]
      operationId: disableConnectedAccount
      summary: Stop sending money to a connected account
      description: What it already earned is still paid out. New payments cannot name it as a destination.
      parameters:
        - $ref: "#/components/parameters/ConnectedAccountId"
      responses:
        "200":
          description: The disabled account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/products:
    post:
      tags: [Billing]
      operationId: createProduct
      summary: Create a product
      description: Something you sell. Give it one or more prices to make it buyable.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProduct"
      responses:
        "201":
          description: The product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [Billing]
      operationId: listProducts
      summary: List products
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Products, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/products/{id}:
    get:
      tags: [Billing]
      operationId: getProduct
      summary: Retrieve a product
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Billing]
      operationId: updateProduct
      summary: Update or archive a product
      description: Set `active` to `false` to archive it. Fields you leave out stay as they are.
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProduct"
      responses:
        "200":
          description: The updated product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/prices:
    post:
      tags: [Billing]
      operationId: createPrice
      summary: Create a price
      description: |
        A price with an `interval` recurs (a subscription price), one without is a single payment. A price never
        changes: to charge something else, archive it and create a new one, so existing subscriptions keep their terms.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrice"
      responses:
        "201":
          description: The price.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Price"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [Billing]
      operationId: listPrices
      summary: List prices
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - name: product
          in: query
          schema:
            type: string
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Prices, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/prices/{id}:
    get:
      tags: [Billing]
      operationId: getPrice
      summary: Retrieve a price
      parameters:
        - $ref: "#/components/parameters/PriceId"
      responses:
        "200":
          description: The price.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Price"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Billing]
      operationId: updatePrice
      summary: Archive a price or change its label
      description: Only `active` and `nickname` can change. The amount and interval never do.
      parameters:
        - $ref: "#/components/parameters/PriceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active:
                  type: boolean
                nickname:
                  type: string
      responses:
        "200":
          description: The updated price.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Price"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/subscriptions:
    post:
      tags: [Billing]
      operationId: createSubscription
      summary: Start a subscription
      description: |
        Bills a customer on a recurring price. Without a trial the first invoice is charged to the customer's saved
        card at once; if that fails the subscription is `incomplete`. With a trial (`trial_days`, or the trial of the
        price) the first invoice is created when the trial ends. A subscription is billed in advance: each period is
        invoiced as it starts. Failed payments are retried (see `/v1/billing_settings`) and the subscription is
        `past_due` meanwhile.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscription"
      responses:
        "201":
          description: The subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [Billing]
      operationId: listSubscriptions
      summary: List subscriptions
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/SubscriptionStatus"
        - name: customer
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Subscriptions, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/subscriptions/{id}:
    get:
      tags: [Billing]
      operationId: getSubscription
      summary: Retrieve a subscription
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      responses:
        "200":
          description: The subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Billing]
      operationId: updateSubscription
      summary: Change a subscription
      description: |
        Replace its `items` to change plan or quantity. The unused part of the old plan is credited and the rest of the
        period is charged at the new one, as proration lines that join the next invoice, or are invoiced and charged
        now with `bill_immediately`. Use `proration_behavior: none` to skip them.
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscription"
      responses:
        "200":
          description: The updated subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/subscriptions/{id}/cancel:
    post:
      tags: [Billing]
      operationId: cancelSubscription
      summary: Cancel a subscription
      description: Cancels now, or with `at_period_end` when the paid period runs out. Nothing is refunded.
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                at_period_end:
                  type: boolean
      responses:
        "200":
          description: The subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/subscriptions/{id}/pause:
    post:
      tags: [Billing]
      operationId: pauseSubscription
      summary: Pause collection
      description: No new invoices are created while it is paused.
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      responses:
        "200":
          description: The subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/subscriptions/{id}/resume:
    post:
      tags: [Billing]
      operationId: resumeSubscription
      summary: Resume collection
      description: If the paid period is still running nothing is billed yet. Otherwise a new period starts now and is billed.
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      responses:
        "200":
          description: The subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/subscriptions/{id}/proration_preview:
    post:
      tags: [Billing]
      operationId: previewSubscriptionChange
      summary: Preview the proration of a plan change
      description: Shows the credit and charge lines a change would create, without changing anything.
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/SubscriptionItemInput"
      responses:
        "200":
          description: The lines and their net amount (negative is a credit).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProrationPreview"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/subscriptions/{id}/upcoming_invoice:
    get:
      tags: [Billing]
      operationId: getUpcomingInvoice
      summary: Preview the next invoice
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      responses:
        "200":
          description: What the next renewal will charge, including any waiting proration lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpcomingInvoice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/subscription_stats:
    get:
      tags: [Billing]
      operationId: getSubscriptionStats
      summary: Recurring revenue and subscriber counts
      description: MRR is the monthly value of active and past due subscriptions per currency. Trials are not revenue yet.
      responses:
        "200":
          description: The figures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/credit_balances:
    get:
      tags: [Billing]
      operationId: getCreditBalance
      summary: Credit a customer holds
      description: >-
        A plan change that credits more than the next invoice costs leaves the rest as credit. Later invoices
        use it before the card is charged, and a voided invoice gives back what it used.
      parameters:
        - name: customer
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The balance per currency and the latest changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditBalance"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/invoices:
    post:
      tags: [Billing]
      operationId: createInvoice
      summary: Create a one-off invoice
      description: Creates a draft. Finalize it to number it and get a link the customer can pay at.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoice"
      responses:
        "201":
          description: The draft invoice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [Billing]
      operationId: listInvoices
      summary: List invoices
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/InvoiceStatus"
        - name: customer
          in: query
          schema:
            type: string
        - name: subscription
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Invoices, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/invoices/{id}:
    get:
      tags: [Billing]
      operationId: getInvoice
      summary: Retrieve an invoice
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: The invoice, with its payment attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Billing]
      operationId: deleteInvoice
      summary: Delete a draft invoice
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/invoices/{id}/finalize:
    post:
      tags: [Billing]
      operationId: finalizeInvoice
      summary: Finalize a draft invoice
      description: Numbers the invoice and opens it for payment. The customer is emailed the link of its page.
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: The open invoice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/invoices/{id}/pay:
    post:
      tags: [Billing]
      operationId: payInvoice
      summary: Charge the saved card for an invoice
      description: "A card that is refused is an answer (paid is false, with a failure_code), not an error."
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: How it went.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayInvoiceResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/invoices/{id}/void:
    post:
      tags: [Billing]
      operationId: voidInvoice
      summary: Void an unpaid invoice
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: The void invoice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/invoices/{id}/pdf:
    get:
      tags: [Billing]
      operationId: getInvoicePdf
      summary: Download the invoice as a PDF
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: A printable A4 invoice.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/billing_settings:
    get:
      tags: [Billing]
      operationId: getBillingSettings
      summary: Retrieve the retry rules
      responses:
        "200":
          description: When unpaid invoices are retried and what happens after the last retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Billing]
      operationId: updateBillingSettings
      summary: Change the retry rules
      description: |
        `retry_days` are the days after the first failed payment on which the invoice is tried again (default 1, 3, 5, 7).
        After the last failed retry the subscription is canceled (`cancel`) or kept as `unpaid`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingSettings"
      responses:
        "200":
          description: The saved rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/bnpl/settings:
    get:
      tags: [Instalments]
      operationId: getBnplSettings
      summary: Which providers you offer and how the best one is chosen
      description: A merchant who never changed anything has every provider on, in the catalogue order, and lets the customer choose.
      responses:
        "200":
          description: The routing mode, its weights and every provider with its limits, in your order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BnplSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Instalments]
      operationId: updateBnplSettings
      summary: Change the providers, their order or the routing mode
      description: |
        Everything is optional; what is left out stays as it is. A provider's `priority` is a position, 0 being first: it
        takes exactly that place and the others keep their order around it. Two providers cannot be given the same place.
        `routing_mode` is one of `customer_choice`, `cheapest`, `fastest`, `best_approval` and `weighted`;
        `weights` count only in the last.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBnplSettings"
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BnplSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/bnpl/applications:
    get:
      tags: [Instalments]
      operationId: listBnplApplications
      summary: List applications for instalments
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/BnplApplicationStatus"
        - name: provider
          in: query
          schema:
            type: string
        - name: payment
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BnplApplicationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/bnpl/applications/{id}:
    get:
      tags: [Instalments]
      operationId: getBnplApplication
      summary: Retrieve an application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The application, with what the provider keeps and what you receive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BnplApplication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/bnpl/analytics:
    get:
      tags: [Instalments]
      operationId: getBnplAnalytics
      summary: How each provider has done for you
      description: |
        Per provider over the last `days` days (1 to 365, default 30): applications by outcome, the approval rate among those
        decided, how long a decision took, financed volume, fees paid, and the state of the provider's circuit right now
        (`open` means customers are not sent to it).
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        "200":
          description: The figures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BnplAnalytics"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/bnpl/routing_decisions/{payment_intent}:
    get:
      tags: [Instalments]
      operationId: getRoutingDecision
      summary: Why a provider was chosen for a payment
      description: |
        The latest time offers were worked out for the payment: who was ranked how, what each would cost, who was left out and
        why, and a sentence that says it all. A 404 means the customer never looked at instalments.
      parameters:
        - name: payment_intent
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingDecision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/checkout_sessions:
    post:
      tags: [Payments]
      operationId: createCheckoutSession
      summary: Create a hosted checkout
      description: Creates a payment and returns the address of the page where the customer pays.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentIntent"
      responses:
        "201":
          description: The payment and where to send the customer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/payment_intents/{id}/stream:
    get:
      tags: [Payments]
      operationId: streamPaymentIntent
      summary: Follow a payment live
      description: |
        A Server-Sent Events stream (`Accept: text/event-stream`). It starts with the payment's current status and
        then sends one `status` event for every change, closing after the payment reaches an end state
        (`succeeded`, `failed`, `canceled`, `refunded`). Use it to flip a screen the moment a customer has paid,
        for example next to a printed QR code. For back-end processing use webhooks instead.
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: "The event stream. Each event has the name `status` and JSON data such as `{\"status\":\"succeeded\"}`."
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/payment_links:
    post:
      tags: [Payment links]
      operationId: createPaymentLink
      summary: Create a payment link
      description: |
        A link opens a Cutpay page where the customer pays. A **fixed** link has one price, a
        **customer_chooses** link lets the customer type the amount (within `min_amount` and `max_amount`), and a
        **products** link sums its line items. Price, currency and type cannot be changed afterwards: create a
        new link instead.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentLink"
      responses:
        "201":
          description: The link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLink"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [Payment links]
      operationId: listPaymentLinks
      summary: List payment links
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
      responses:
        "200":
          description: A page of links, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLinkList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/payment_links/{id}:
    get:
      tags: [Payment links]
      operationId: getPaymentLink
      summary: Retrieve a payment link
      parameters:
        - $ref: "#/components/parameters/LinkId"
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Payment links]
      operationId: updatePaymentLink
      summary: Update a payment link
      description: |
        Set `active` to `false` to stop taking payments. A link also closes by itself when it reaches `max_uses`
        or its `expires_at`. Fields you leave out stay as they are.
      parameters:
        - $ref: "#/components/parameters/LinkId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePaymentLink"
      responses:
        "200":
          description: The updated link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLink"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/payment_links/{id}/payments:
    get:
      tags: [Payment links]
      operationId: listPaymentLinkPayments
      summary: List the payments made with a link
      parameters:
        - $ref: "#/components/parameters/LinkId"
      responses:
        "200":
          description: Paid uses of the link, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLinkPayments"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/payment_links/{id}/qr:
    get:
      tags: [Payment links]
      operationId: getPaymentLinkQr
      summary: Download the QR code of a link
      description: Returns the code as an image. Colours default to the ones saved on the link.
      parameters:
        - $ref: "#/components/parameters/LinkId"
        - name: format
          in: query
          schema:
            type: string
            enum: [svg, png]
            default: svg
        - name: size
          in: query
          description: Target width in pixels for PNG (128 to 2048).
          schema:
            type: integer
            minimum: 128
            maximum: 2048
            default: 512
        - name: fg
          in: query
          description: Code colour as `#rrggbb`.
          schema:
            type: string
            pattern: "^#[0-9a-fA-F]{6}$"
        - name: bg
          in: query
          description: Background colour as `#rrggbb`.
          schema:
            type: string
            pattern: "^#[0-9a-fA-F]{6}$"
      responses:
        "200":
          description: The image.
          content:
            image/svg+xml:
              schema:
                type: string
            image/png:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/payment_links/{id}/card.pdf:
    get:
      tags: [Payment links]
      operationId: getPaymentLinkCard
      summary: Download a print-ready table card
      description: An A6 PDF with the link's name, its QR code and the address in words.
      parameters:
        - $ref: "#/components/parameters/LinkId"
      responses:
        "200":
          description: The PDF.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/refunds:
    post:
      tags: [Refunds]
      operationId: createRefund
      summary: Refund a payment
      description: |
        Refunds all or part of a succeeded payment. The processing fee is not returned. A payment can be refunded
        several times until its whole amount has been returned.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_intent]
              properties:
                payment_intent:
                  type: string
                  description: The payment to refund.
                amount:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Defaults to everything still refundable.
                reason:
                  type: string
                  maxLength: 200
      responses:
        "201":
          description: The refund.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [Refunds]
      operationId: listRefunds
      summary: List refunds
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - name: payment_intent
          in: query
          description: Only refunds of this payment.
          schema:
            type: string
      responses:
        "200":
          description: A page of refunds, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/balance:
    get:
      tags: [Balance]
      operationId: getBalance
      summary: Retrieve your balance
      description: |
        `pending` funds are not yet available, `available` funds can be paid out. A negative amount means you
        owe money, for example after a refund that followed a payout.
      parameters:
        - $ref: "#/components/parameters/ConnectedAccountQuery"
      responses:
        "200":
          description: Your balance, per currency.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "401":
