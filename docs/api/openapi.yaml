          type: string
        amount:
          type: integer
          format: int64
        currency:
          type: string
        reason:
          type: [string, "null"]
        status:
          type: string
          enum: [pending, succeeded, failed]
        failure_code:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
    RefundList:
      type: object
      required: [object, data, has_more]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/Refund"
