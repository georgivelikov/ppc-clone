        amount_collected:
          type: integer
          format: int64
          description: Total paid through the link, in the smallest currency unit.
        expires_at:
          type: [string, "null"]
          format: date-time
        active:
          type: boolean
        after_completion:
          type: string
          enum: [message, redirect]
        redirect_url:
          type: [string, "null"]
        success_message:
          type: [string, "null"]
        metadata:
          $ref: "#/components/schemas/Metadata"
        qr_style:
          $ref: "#/components/schemas/QrStyle"
        line_items:
          type: array
          items:
            $ref: "#/components/schemas/LinkLineItem"
        created_at:
          type: string
          format: date-time
    PaymentLinkList:
      type: object
      required: [object, data, has_more]
      properties:
        object:
