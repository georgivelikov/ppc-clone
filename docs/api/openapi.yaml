webhooks:
  event:
    post:
      tags: [Webhooks]
      operationId: receiveEvent
      summary: An event, sent to your endpoint
      description: |
        Cutpay sends a `POST` with the event as JSON. Answer with any `2xx` status within 10 seconds to
        acknowledge it; anything else, or no answer, makes Cutpay retry after 1 minute, 5 minutes, 30 minutes,
        2 hours, 5 hours and then every 10 hours, for up to 3 days.

        Requests carry `Cutpay-Signature: t=<unix seconds>,v1=<hex>`, where `v1` is the HMAC-SHA256 of
        `<t>.<raw body>` using your endpoint's signing secret. Check it on the **raw** body and reject requests
        whose timestamp is more than 5 minutes old. The same event can arrive more than once (use the event
        `id` to deduplicate), and events can arrive out of order.
      security: []
      parameters:
        - name: Cutpay-Signature
          in: header
          required: true
          schema:
            type: string
            examples:
              - t=1760000000,v1=53dc054739ad94d3532227ba8d397f66ed2166a6b66940c2006692fa6db6829f
        - name: Cutpay-Event-Id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Event"
      responses:
        "200":
          description: Acknowledged. Any 2xx status works.
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: "sk_test_... / sk_live_... / rk_..."
      description: A secret or restricted API key. Publishable keys cannot call this API.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Makes the request safe to retry. Up to 255 characters; kept for 24 hours.
      schema:
        type: string
        maxLength: 255
    ApiVersion:
      name: Cutpay-Version
      in: header
      required: false
      description: The API version to use. Defaults to the latest.
      schema:
        type: string
        enum: ["2026-10-01"]
    Limit:
      name: limit
      in: query
      description: How many objects to return (1 to 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    StartingAfter:
      name: starting_after
      in: query
      description: The `id` of the last object of the previous page.
      schema:
        type: string
    ExpandPayment:
      name: expand[]
      in: query
      description: Fields to replace with the full object.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum: [latest_attempt]
    PaymentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [pay_01J9ZK3Q8V2M6X4N7B5C1D0E9F]
    CustomerId:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [cus_01J9ZK3Q8V2M6X4N7B5C1D0E9F]
    SetupIntentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [seti_01J9ZK3Q8V2M6X4N7B5C1D0E9F]
    LinkId:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [plink_01J9ZK3Q8V2M6X4N7B5C1D0E9F]
    EndpointId:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [we_01J9ZK3Q8V2M6X4N7B5C1D0E9F]
    DeliveryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        examples: [whd_01J9ZK3Q8V2M6X4N7B5C1D0E9F]
  responses:
    InvalidRequest:
      description: The request was not valid. `error.param` names the offending field when there is one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The API key is missing, wrong, revoked or expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The key is valid but may not do this, for example a restricted key without the scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such object in this mode.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The object is in a state that does not allow this, or the idempotency key was misused.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message]
          properties:
            type:
              type: string
              examples: [invalid_request_error]
            code:
              type: string
              description: A stable machine-readable code.
              examples: [payment_not_found]
            message:
              type: string
            param:
              type: string
            request_id:
              type: string
    Deleted:
      type: object
      required: [id, object, deleted]
      properties:
        id:
          type: string
        object:
          type: string
        deleted:
          type: boolean
    Metadata:
      type: object
      description: Your own key-value data, kept on the object and returned as you sent it.
      additionalProperties:
        type: string
    PaymentStatus:
      type: string
      enum:
        - requires_payment_method
        - processing
        - requires_action
        - requires_capture
        - succeeded
        - failed
        - canceled
        - partially_refunded
        - refunded
    CreatePaymentIntent:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 99999999
          description: In the smallest currency unit.
        currency:
          type: string
          description: Three-letter ISO code.
          examples: [EUR]
        description:
          type: string
          maxLength: 500
        customer_email:
          type: string
          format: email
        metadata:
          $ref: "#/components/schemas/Metadata"
        return_url:
          type: string
          format: uri
          description: Where the customer returns after paying on the hosted page.
        merchant_name:
          type: string
          maxLength: 160
          description: Shown to the customer on the checkout.
        capture_method:
          type: string
          enum: [automatic, manual]
          default: automatic
          description: |
            `manual` only holds the amount on the card (status `requires_capture`). Take it with
            `POST /v1/payment_intents/{id}/capture`, or release it by cancelling. A hold that is not captured within
            seven days is released automatically.
        customer:
          type: string
          description: A customer id. Needed for `payment_method`, `off_session` and `setup_future_usage`.
        payment_method:
          type: string
          description: A saved card of the customer. With `off_session` and none given, the default card is used.
        off_session:
          type: boolean
          description: |
            Charge the saved card right away without the customer being present (subscriptions, repeat orders). The
            bank cannot ask for 3-D Secure then: a card that needs it fails with `authentication_required` and the
            customer has to pay on a hosted page.
        setup_future_usage:
          type: string
          enum: [off_session]
          description: Save the card the customer pays with to the customer, for future off-session payments.
    Address:
      type: object
      properties:
        line1:
          type: [string, "null"]
        line2:
          type: [string, "null"]
        city:
          type: [string, "null"]
        postal_code:
          type: [string, "null"]
        country:
          type: [string, "null"]
    CreateCustomer:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        phone:
          type: string
        description:
          type: string
        address:
          $ref: "#/components/schemas/Address"
        metadata:
          $ref: "#/components/schemas/Metadata"
    UpdateCustomer:
      allOf:
        - $ref: "#/components/schemas/CreateCustomer"
        - type: object
          properties:
            default_payment_method:
              type: string
    Customer:
      type: object
      required: [id, object, livemode, created_at]
      properties:
        id:
          type: string
        object:
          type: string
          const: customer
        livemode:
          type: boolean
        email:
          type: [string, "null"]
        name:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        description:
          type: [string, "null"]
        address:
          oneOf:
            - $ref: "#/components/schemas/Address"
            - type: "null"
        metadata:
          $ref: "#/components/schemas/Metadata"
        default_payment_method:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
    CustomerList:
      type: object
      required: [object, data, has_more]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        has_more:
          type: boolean
    PaymentMethod:
      type: object
      required: [id, object, type, customer]
      properties:
        id:
          type: string
        object:
          type: string
          const: payment_method
        type:
          type: string
          const: card
        customer:
          type: string
        livemode:
          type: boolean
        card:
          type: object
          properties:
            brand:
              type: [string, "null"]
            last4:
              type: [string, "null"]
            exp_month:
              type: [integer, "null"]
            exp_year:
              type: [integer, "null"]
            fingerprint:
              type: [string, "null"]
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
    PaymentMethodList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/PaymentMethod"
    CreateSetupIntent:
      type: object
      required: [customer]
      properties:
        customer:
          type: string
        description:
          type: string
          maxLength: 500
        return_url:
          type: string
          format: uri
          description: Where the hosted page sends the customer afterwards.
        merchant_name:
          type: string
          maxLength: 160
          description: Shown to the customer on the hosted page.
    SetupIntent:
      type: object
      required: [id, object, customer, status, client_secret, url]
      properties:
        id:
          type: string
        object:
          type: string
          const: setup_intent
        livemode:
          type: boolean
        customer:
          type: string
        status:
          type: string
          enum: [requires_payment_method, requires_action, succeeded, failed, canceled]
        client_secret:
          type: string
        url:
          type: string
          format: uri
          description: The hosted page where the customer enters their card.
        payment_method:
          type: [string, "null"]
        description:
          type: [string, "null"]
        return_url:
          type: [string, "null"]
        failure_code:
          type: [string, "null"]
        failure_message:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
    CaptureRequest:
      type: object
      properties:
        amount_to_capture:
          type: integer
          format: int64
          minimum: 1
          description: Up to the authorised amount. Omit it to take everything; the rest of a smaller capture is released.
    PaymentAttempt:
      type: object
      properties:
        id:
          type: string
        method_type:
          type: string
          examples: [card]
        card_brand:
          type: string
          enum: [visa, mastercard, amex, unknown]
        card_last4:
          type: string
        card_exp_month:
          type: integer
        card_exp_year:
          type: integer
        status:
          type: string
        decline_code:
          type: [string, "null"]
        three_ds_status:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
    PaymentIntent:
      type: object
      required: [id, object, livemode, amount, currency, status, created_at]
      properties:
        id:
          type: string
        object:
          type: string
          const: payment_intent
        livemode:
          type: boolean
        amount:
          type: integer
          format: int64
        currency:
          type: string
        status:
          $ref: "#/components/schemas/PaymentStatus"
        capture_method:
          type: string
        channel:
          type: string
          enum: [online, moto]
          description: |
            `online` for checkout and the API. `moto` (mail or telephone order) for payments keyed in by the
            merchant at the dashboard's virtual terminal; the card network does not ask for 3-D Secure for those.
        description:
          type: [string, "null"]
        customer_email:
          type: [string, "null"]
        metadata:
          $ref: "#/components/schemas/Metadata"
        client_secret:
          type: string
          description: Hand this to the checkout SDK. Treat it like a password for this one payment.
        return_url:
          type: [string, "null"]
        amount_refunded:
          type: integer
          format: int64
        customer:
          type: [string, "null"]
          description: The customer the payment belongs to.
        payment_method:
          type: [string, "null"]
          description: The saved card the payment was charged to.
        off_session:
          type: boolean
          description: Charged to a saved card without the customer present.
        amount_authorized:
          type: [integer, "null"]
          format: int64
          description: What was held on the card for a `manual` capture payment. `amount` is what was taken once captured.
        capture_before:
          type: [string, "null"]
          format: date-time
          description: While `requires_capture`, the moment after which the hold is released automatically.
        failure_code:
          type: [string, "null"]
        failure_message:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/PaymentAttempt"
        refunds:
          type: array
          items:
            $ref: "#/components/schemas/Refund"
        latest_attempt:
          description: The newest attempt's id, or the attempt itself with `expand[]=latest_attempt`.
          oneOf:
            - type: string
            - $ref: "#/components/schemas/PaymentAttempt"
            - type: "null"
    PaymentIntentList:
      type: object
      required: [object, data, has_more]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/PaymentIntent"
        has_more:
          type: boolean
    CheckoutSession:
      type: object
      required: [payment_id, client_secret, url]
      properties:
        payment_id:
          type: string
        client_secret:
          type: string
        url:
          type: string
          format: uri
          description: Send the customer here.
    LinkLineItem:
      type: object
      required: [product_name, unit_amount, quantity]
      properties:
        product_name:
          type: string
          maxLength: 120
        unit_amount:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 99
    QrStyle:
      type: object
      description: Colours of the printed code. Keep strong contrast or phones may not scan it.
      properties:
        fg:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        bg:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
    PaymentLinkStatus:
      type: string
      enum: [active, inactive, expired, sold_out]
    CreatePaymentLink:
      type: object
      required: [type, currency, title]
      properties:
        type:
          type: string
          enum: [fixed, customer_chooses, products]
        currency:
          type: string
        title:
          type: string
          maxLength: 120
        amount:
          type: integer
          format: int64
          description: Required for `fixed` links.
        min_amount:
          type: integer
          format: int64
          description: For `customer_chooses` links. Defaults to 100.
        max_amount:
          type: integer
          format: int64
          description: For `customer_chooses` links. Defaults to the largest payment.
        line_items:
          type: array
          maxItems: 20
          description: Required for `products` links.
          items:
            $ref: "#/components/schemas/LinkLineItem"
        description:
          type: string
          maxLength: 1000
        image_url:
          type: string
          format: uri
        collect:
          type: array
          description: What to ask the customer for before they pay.
          items:
            type: string
            enum: [email, phone, name, address]
        quantity_adjustable:
          type: boolean
          description: Lets the customer change the quantity (not for `customer_chooses` links).
        max_uses:
          type: integer
          minimum: 1
          description: The link closes after this many successful payments, however many customers open it at once.
        expires_at:
          type: string
          format: date-time
        after_completion:
          type: string
          enum: [message, redirect]
          default: message
        redirect_url:
          type: string
          format: uri
          description: Required when `after_completion` is `redirect`.
        success_message:
          type: string
          maxLength: 500
        metadata:
          $ref: "#/components/schemas/Metadata"
        qr_style:
          $ref: "#/components/schemas/QrStyle"
    UpdatePaymentLink:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        image_url:
          type: string
          format: uri
        collect:
          type: array
          items:
            type: string
            enum: [email, phone, name, address]
        max_uses:
          type: integer
          minimum: 1
        expires_at:
          type: string
          format: date-time
        active:
          type: boolean
        after_completion:
          type: string
          enum: [message, redirect]
        redirect_url:
          type: string
          format: uri
        success_message:
          type: string
        metadata:
          $ref: "#/components/schemas/Metadata"
        qr_style:
          $ref: "#/components/schemas/QrStyle"
    PaymentLink:
      type: object
      required: [id, object, livemode, url, slug, status, type, currency, title, active, created_at]
      properties:
        id:
          type: string
        object:
          type: string
          const: payment_link
        livemode:
          type: boolean
        url:
          type: string
          format: uri
          description: Share this address.
        slug:
          type: string
        status:
          $ref: "#/components/schemas/PaymentLinkStatus"
        type:
          type: string
          enum: [fixed, customer_chooses, products]
        amount:
          type: [integer, "null"]
          format: int64
        currency:
          type: string
        min_amount:
          type: [integer, "null"]
          format: int64
        max_amount:
          type: [integer, "null"]
          format: int64
        title:
          type: string
        description:
          type: [string, "null"]
        image_url:
          type: [string, "null"]
        collect:
          type: array
          items:
            type: string
            enum: [email, phone, name, address]
        quantity_adjustable:
          type: boolean
        max_uses:
          type: [integer, "null"]
        uses_count:
          type: integer
