          type: integer
          format: int64
        max_amount:
          type: integer
          format: int64
        currencies:
          type: array
          items:
            type: string
        countries:
          type: array
          items:
            type: string
    BnplSettings:
      type: object
      properties:
        object:
          type: string
          const: bnpl_settings
        routing_mode:
          $ref: "#/components/schemas/RoutingMode"
        weights:
