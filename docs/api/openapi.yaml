          items:
            type: object
            properties:
              currency:
                type: string
              amount:
                type: integer
                format: int64
        history:
          type: array
          description: The latest changes, newest first.
          items:
            type: object
            properties:
              id:
                type: string
              currency:
                type: string
              amount:
                type: integer
                format: int64
