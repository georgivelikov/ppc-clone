      type: object
      required: [object, data, has_more]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
        has_more:
          type: boolean
    PayInvoiceResult:
      type: object
      properties:
        invoice:
          $ref: "#/components/schemas/Invoice"
        paid:
          type: boolean
        failure_code:
          type: [string, "null"]
        failure_message:
          type: [string, "null"]
    BillingSettings:
      type: object
      required: [retry_days]
      properties:
        object:
          type: string
          const: billing_settings
        retry_days:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 60
          maxItems: 10
          description: Increasing days after the first failed payment.
        final_action:
          type: string
          enum: [cancel, unpaid]
          default: cancel
    CaptureRequest:
      type: object
      properties:
