        description:
          type: string
        image_url:
          type: string
        active:
          type: boolean
        metadata:
          $ref: "#/components/schemas/Metadata"
    Product:
      type: object
      required: [id, object, name, active]
      properties:
        id:
          type: string
        object:
          type: string
          const: product
        livemode:
          type: boolean
        name:
          type: string
        description:
          type: [string, "null"]
        image_url:
          type: [string, "null"]
        active:
          type: boolean
        metadata:
          $ref: "#/components/schemas/Metadata"
        created_at:
          type: string
          format: date-time
    ProductList:
      type: object
      required: [object, data, has_more]
      properties:
