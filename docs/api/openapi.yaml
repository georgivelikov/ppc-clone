        card_brand:
          type: string
          enum: [visa, mastercard, amex, unknown]
        card_last4:
          type: string
        card_exp_month:
          type: integer
        card_exp_year:
          type: integer
        status:
          type: string
        decline_code:
          type: [string, "null"]
        three_ds_status:
          type: [string, "null"]
        created_at:
          type: string
