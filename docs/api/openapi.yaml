        created:
          type: string
          format: date-time
        livemode:
          type: boolean
    PayoutList:
      type: object
      required: [object, data, has_more]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/Payout"
        has_more:
          type: boolean
    BankAccount:
      type: object
      required: [id, object, country, iban_last4, holder_name, currency, status]
      properties:
        id:
          type: string
        object:
          type: string
          const: bank_account
        country:
          type: string
        iban_last4:
          type: string
        holder_name:
          type: string
        currency:
          type: string
        status:
          type: string
        livemode:
          type: boolean
        created:
          type: string
          format: date-time
    PayoutSchedule:
      type: object
      required: [object, schedule, delay_days, weekly_anchor]
      properties:
        object:
          type: string
          const: payout_schedule
        schedule:
          type: string
          enum: [daily, weekly, manual]
        delay_days:
          type: integer
        weekly_anchor:
          type: string
    EventType:
      type: string
      enum:
        - payment_intent.created
        - payment_intent.requires_action
        - payment_intent.amount_capturable_updated
        - payment_intent.succeeded
        - payment_intent.payment_failed
        - payment_intent.canceled
        - charge.refunded
        - refund.created
        - refund.failed
        - payout.created
        - payout.paid
        - payout.failed
        - payment_link.created
        - payment_link.deactivated
        - customer.created
        - customer.updated
        - customer.deleted
        - payment_method.attached
        - payment_method.detached
        - setup_intent.succeeded
        - setup_intent.setup_failed
        - webhook_endpoint.test
    Event:
      type: object
      required: [id, object, type, api_version, livemode, created_at, data]
      properties:
        id:
          type: string
          description: Stable across retries; use it to deduplicate.
        object:
          type: string
          const: event
        type:
          $ref: "#/components/schemas/EventType"
        api_version:
          type: string
        livemode:
          type: boolean
        created_at:
          type: string
          format: date-time
        data:
          type: object
          required: [object]
          properties:
            object:
              type: object
              description: The payment intent, refund, payout or endpoint the event is about.
              additionalProperties: true
    WebhookEndpoint:
      type: object
      required: [id, object, url, enabled_events, status, livemode]
      properties:
        id:
          type: string
        object:
          type: string
          const: webhook_endpoint
        url:
          type: string
          format: uri
        description:
          type: [string, "null"]
        enabled_events:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [enabled, disabled]
        disabled_reason:
          type: [string, "null"]
        livemode:
          type: boolean
        created_at:
          type: string
          format: date-time
        secret:
          type: [string, "null"]
          description: The signing secret. Only in the response that creates the endpoint.
    DeliveryAttempt:
      type: object
      required: [attempt, duration_ms, created_at]
      properties:
        attempt:
          type: integer
        response_code:
          type: [integer, "null"]
          description: Null when your server did not answer.
        response_body_snippet:
          type: [string, "null"]
          description: The first 500 characters of your answer.
        error:
          type: [string, "null"]
        duration_ms:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    WebhookDelivery:
      type: object
      required: [id, object, event_id, event_type, endpoint_id, status, attempts]
      properties:
        id:
          type: string
        object:
          type: string
          const: webhook_delivery
        event_id:
          type: string
        event_type:
          $ref: "#/components/schemas/EventType"
        endpoint_id:
          type: string
        status:
          type: string
          enum: [pending, succeeded, failed]
        attempts:
          type: integer
        next_attempt_at:
          type: [string, "null"]
          format: date-time
        last_response_code:
          type: [integer, "null"]
        livemode:
          type: boolean
        created_at:
          type: string
          format: date-time
        attempt_log:
          type: [array, "null"]
          description: Only when retrieving a single delivery.
          items:
            $ref: "#/components/schemas/DeliveryAttempt"
    WebhookDeliveryList:
      type: object
      required: [object, data, has_more]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDelivery"
        has_more:
          type: boolean
