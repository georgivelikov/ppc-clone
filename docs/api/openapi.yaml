        object:
          type: string
          const: payout
        amount:
          type: integer
          format: int64
          description: What reaches the bank.
        fee:
          type: integer
          format: int64
          description: The instant-payout fee, charged on top.
        currency:
          type: string
        status:
          $ref: "#/components/schemas/PayoutStatus"
        kind:
          type: string
          enum: [scheduled, instant]
        arrival_date:
          type: string
          format: date
        bank_account_id:
          type: string
        failure_code:
          type: [string, "null"]
