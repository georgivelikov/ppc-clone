        customer_email:
          type: [string, "null"]
        decline_reason:
          type: [string, "null"]
        decision_ms:
          type: [integer, "null"]
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        decided_at:
          type: [string, "null"]
          format: date-time
    BnplApplicationList:
      type: object
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/BnplApplication"
        has_more:
          type: boolean
