          type: boolean
        customer:
          type: string
        status:
          type: string
          enum: [requires_payment_method, requires_action, succeeded, failed, canceled]
        client_secret:
          type: string
        url:
          type: string
          format: uri
          description: The hosted page where the customer enters their card.
        payment_method:
          type: [string, "null"]
        description:
          type: [string, "null"]
        return_url:
          type: [string, "null"]
        failure_code:
          type: [string, "null"]
        failure_message:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
    CreateConnectedAccount:
      type: object
