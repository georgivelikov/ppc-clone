# Sent with every response. add_header in a location block replaces the ones from the server block, so each location
# that sets its own headers includes this file again.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
