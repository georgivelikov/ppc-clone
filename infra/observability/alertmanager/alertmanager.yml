route:
  receiver: mailpit
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: mailpit
    email_configs:
      - to: oncall@cutpay.test
        from: alertmanager@cutpay.test
        smarthost: mailpit:1025
        require_tls: false
        send_resolved: true
