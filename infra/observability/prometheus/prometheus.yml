global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Services run on the host (./gradlew bootRun), so Prometheus reaches them through host.docker.internal.
scrape_configs:
  - job_name: cutpay
    metrics_path: /actuator/prometheus
    static_configs:
      - { targets: ["host.docker.internal:8080"], labels: { service: gateway } }
      - { targets: ["host.docker.internal:8081"], labels: { service: identity } }
      - { targets: ["host.docker.internal:8082"], labels: { service: payments } }
      - { targets: ["host.docker.internal:8083"], labels: { service: acquirer-sim } }
      - { targets: ["host.docker.internal:8084"], labels: { service: ledger } }
      - { targets: ["host.docker.internal:8085"], labels: { service: payouts } }
      - { targets: ["host.docker.internal:8086"], labels: { service: webhooks } }
      - { targets: ["host.docker.internal:8087"], labels: { service: links } }
      - { targets: ["host.docker.internal:8088"], labels: { service: billing } }
      - { targets: ["host.docker.internal:8089"], labels: { service: bnpl-sim } }
      - { targets: ["host.docker.internal:8091"], labels: { service: bnpl } }
      - { targets: ["host.docker.internal:8092"], labels: { service: notifications } }
      - { targets: ["host.docker.internal:8093"], labels: { service: kyc-sim } }
      - { targets: ["host.docker.internal:8094"], labels: { service: reporting } }
