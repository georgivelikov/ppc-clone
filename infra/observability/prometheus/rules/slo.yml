groups:
  - name: cutpay-slo
    rules:
      - alert: ServiceDown
        expr: up{job="cutpay"} == 0
        for: 1m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.service }} is not answering scrapes"

      # Business SLO: checkout confirm p95 < 800 ms.
      - alert: CheckoutConfirmSlow
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{service="payments", uri=~".*confirm.*"}[5m]))) > 0.8
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "Checkout confirm p95 is {{ $value | humanizeDuration }} (SLO 800ms)"

      - alert: ServerErrorsHigh
        expr: |
          sum by (service) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum by (service) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.service }} answers more than 5% of requests with a 5xx"

      # Business SLO: consumer lag < 1,000.
      - alert: ConsumerLagHigh
        expr: max by (service, topic) (kafka_consumer_fetch_manager_records_lag_max) > 1000
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.service }} is {{ $value }} records behind on {{ $labels.topic }}"

      - alert: HikariPoolSaturated
        expr: hikaricp_connections_pending > 0
        for: 2m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.service }} has requests waiting for a database connection"

  - name: cutpay-money
    rules:
      # The three accounts of the money (payments, ledger, acquirer) disagree: see Operations in the back-office.
      - alert: ReconciliationMismatch
        expr: max(cutpay_reconciliation_mismatches) > 0
        for: 1m
        labels: { severity: page }
        annotations:
          summary: "Reconciliation found {{ $value }} difference(s) between payments, the ledger and the acquirer"

      # Merchants' servers that keep failing: deliveries are retried, but giving up means an order was never told.
      - alert: WebhookDeliveriesGivingUp
        expr: sum(increase(cutpay_webhooks_deliveries_total{outcome="gave_up"}[30m])) > 0
        for: 1m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $value }} webhook delivery(ies) gave up after all retries in the last 30 minutes"

      # Fewer than 4 in 5 payments that start end well, over an hour with real volume: a checkout or acquirer problem.
      - alert: PaymentConversionLow
        expr: |
          sum(increase(cutpay_events_total{event_type="PaymentSucceeded"}[1h]))
            / sum(increase(cutpay_events_total{event_type="PaymentIntentCreated"}[1h])) < 0.5
          and sum(increase(cutpay_events_total{event_type="PaymentIntentCreated"}[1h])) > 50
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "Only {{ $value | humanizePercentage }} of started payments succeeded in the last hour"

  - name: cutpay-canary
    rules:
      - alert: CanaryFailing
        expr: min(cutpay_canary_success) == 0
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "The synthetic customer journey (sign up, pay, see the payment) is failing"

      # A canary that stopped reporting is as bad as one that fails.
      - alert: CanaryStale
        expr: time() - max(cutpay_canary_last_run_timestamp_seconds) > 1800
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "The synthetic customer journey has not reported for over 30 minutes"
